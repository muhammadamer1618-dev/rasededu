<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="محمد عامر أحمد">
<title>جدول الحصص | مدارس الفلاح</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
:root{--navy:#0b4b78;--navy2:#073653;--gold:#d7aa2d;--bg:#f4f7fa;--text:#17344b;--border:#dbe4eb}
body{margin:0;background:linear-gradient(135deg,#f8fafc,#edf3f7);font-family:Tahoma,Arial,sans-serif;color:var(--text)}
.top-line{height:6px;background:linear-gradient(90deg,var(--navy2),var(--navy),var(--gold),var(--navy))}
.page{width:min(1000px,calc(100% - 20px));margin:18px auto 30px}
.card{background:#fff;border:1px solid rgba(11,75,120,.12);border-radius:20px;box-shadow:0 14px 40px rgba(18,52,75,.10);overflow:hidden}
.header{padding:15px 18px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:11px;text-align:right}
.logo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.title{margin:0;font-size:21px}.sub{margin:3px 0 0;font-size:11px;color:#dbeaf4}
.search{padding:20px}.field{max-width:500px;margin:auto}
.label{display:block;font-size:13px;font-weight:bold;margin:0 3px 7px}
.input{width:100%;height:50px;border:1px solid #cad8e2;border-radius:12px;background:#fbfcfd;font:700 16px Tahoma;text-align:center;direction:ltr;outline:none}
.input:focus{border-color:#0e6fa9;box-shadow:0 0 0 4px rgba(14,111,169,.09)}
.searchbtn{width:100%;margin-top:9px;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;font:bold 14px Tahoma;cursor:pointer}
.searchbtn:disabled{opacity:.65}
.message{display:none;margin-top:10px;padding:10px;border-radius:10px;text-align:center;font-size:12px;font-weight:bold;background:#fff0f1;color:#ad2631;border:1px solid #f1c4c8}
.message.show{display:block}
.studentbar{display:none;padding:11px 18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);grid-template-columns:2fr 1fr 1fr}
.studentbar.show{display:grid}
.info{padding:3px 12px;border-left:1px solid var(--border)}.info:last-child{border-left:0}
.lab{display:block;font-size:9px;color:#80909d;margin-bottom:3px}.val{font-size:13px;font-weight:bold}
.content{display:none;padding:16px}.content.show{display:block}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.heading{font-size:17px;font-weight:800;color:var(--navy2)}
.week-select{height:40px;min-width:180px;border:1px solid #cfdbe3;border-radius:9px;padding:0 10px;background:#fff;font:700 12px Tahoma;color:var(--navy2)}
.meta{font-size:11px;color:#748596}
.table-wrap{overflow-x:auto;border:1px solid #d5dfe6;border-radius:12px}
.schedule{width:100%;min-width:720px;border-collapse:collapse;table-layout:fixed}
.schedule th{background:#eaf1f6;color:var(--navy2);font-size:11px;padding:10px 5px;border-bottom:1px solid #cad6df}
.schedule th.day-head{width:90px}
.schedule td{padding:12px 5px;font-size:12px;text-align:center;border-bottom:1px solid #e2e8ed;border-left:1px solid #e2e8ed;height:55px}
.schedule tr:last-child td{border-bottom:0}
.schedule td:last-child,.schedule th:last-child{border-left:0}
.day{font-weight:800;color:var(--navy);background:#f7fafc}
.subject{font-weight:700;color:#17344b}
.empty{text-align:center;padding:45px 15px;color:#7d8d9a;font-size:13px}
.footer{text-align:center;padding:12px;color:#7d8d9a;font-size:10px}
@media(max-width:650px){
 .page{width:calc(100% - 12px);margin:10px auto 20px}
 .header{padding:12px}.logo{width:46px;height:46px}.title{font-size:17px}.sub{font-size:9px}
 .search{padding:15px}.studentbar{grid-template-columns:1fr 1fr}.studentbar .info:first-child{grid-column:1/-1;border-left:0;border-bottom:1px solid var(--border);padding-bottom:7px;margin-bottom:5px}
 .studentbar .info:nth-child(2){border-left:1px solid var(--border)}
 .content{padding:12px 9px}.heading{font-size:15px}.week-select{min-width:150px;height:38px}
 .schedule{min-width:610px}.schedule th{font-size:9px;padding:8px 3px}.schedule th.day-head{width:70px}.schedule td{font-size:10px;height:48px;padding:7px 3px}
}
@media(max-width:380px){
 .title{font-size:15px}.sub{font-size:8px}.logo{width:42px;height:42px}
 .studentbar{font-size:11px}.val{font-size:11px}
 .toolbar{align-items:stretch}.week-select{width:100%}
}
</style>
</head>
<body>
<div class="top-line"></div>
<div class="page">
  <div class="card">
    <header class="header">
      <div class="brand">
        <img src="logo.jpeg" class="logo" alt="شعار مدارس الفلاح">
        <div>
          <h1 class="title">جدول الحصص الأسبوعي</h1>
          <div class="sub">مدارس الفلاح الأهلية</div>
        </div>
      </div>
    </header>

    <section class="search" id="searchArea">
      <div class="field">
        <label class="label" for="identityInput">رقم هوية الطالب</label>
        <input class="input" id="identityInput" inputmode="numeric" autocomplete="off" placeholder="أدخل رقم الهوية">
        <button class="searchbtn" id="searchBtn">عرض الجدول</button>
        <div class="message" id="message"></div>
      </div>
    </section>

    <section class="studentbar" id="studentBar">
      <div class="info"><span class="lab">الطالب</span><span class="val" id="studentName">—</span></div>
      <div class="info"><span class="lab">الصف</span><span class="val" id="studentGrade">—</span></div>
      <div class="info"><span class="lab">الشعبة</span><span class="val" id="studentSection">—</span></div>
    </section>

    <section class="content" id="content">
      <div class="toolbar">
        <div>
          <div class="heading">📚 جدول الحصص</div>
          <div class="meta" id="planMeta">اختر الأسبوع</div>
        </div>
        <select class="week-select" id="weekSelect" aria-label="اختيار الأسبوع"></select>
      </div>
      <div id="planArea"></div>
    </section>

    <div class="footer">نظام راصد • مدارس الفلاح الأهلية • تصميم محمد عامر أحمد 2026</div>
  </div>
</div>

<script>
const rasedConfig={
 apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",
 authDomain:"results2026-7c0dd.firebaseapp.com",
 projectId:"results2026-7c0dd",
 storageBucket:"results2026-7c0dd.firebasestorage.app",
 messagingSenderId:"241421115694",
 appId:"1:421421115694:web:96f55fd9fd1d5b18b31abf"
};
const weeklyConfig={
 apiKey:"AIzaSyBYxW_pdFvE1VZyDoTok4-EutPe6oigJhY",
 authDomain:"weekly-plan-3a743.firebaseapp.com",
 projectId:"weekly-plan-3a743",
 storageBucket:"weekly-plan-3a743.firebasestorage.app",
 messagingSenderId:"575884603803",
 appId:"1:575884603803:web:e8c4d82c69fd545bed313e"
};
firebase.initializeApp(rasedConfig);
const db=firebase.firestore();
const weeklyApp=firebase.initializeApp(weeklyConfig,"weeklyScheduleApp");
const weeklyDb=firebase.firestore(weeklyApp);

let currentStudent=null,plans=[];

function clean(v){return String(v||"").replace(/[^\d]/g,"").trim()}
function norm(v){return String(v??"").trim().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[()\-_/]/g," ").replace(/\s+/g," ").toLowerCase()}
function normSection(v){return norm(v).replace(/^الشعبه\s*/,"").replace(/^فصل\s*/,"").trim()}
function gradeNum(v){
 const t=norm(v),d=t.match(/\d+/);if(d)return Number(d[0]);
 const m=[["الاول",1],["الاولى",1],["الثاني",2],["الثانيه",2],["الثالث",3],["الثالثه",3],["الرابع",4],["الرابعه",4],["الخامس",5],["الخامسه",5],["السادس",6],["السادسه",6]];
 for(const [w,n] of m)if(t.includes(w))return n;return null
}
function stage(v){const t=norm(v);if(t.includes("ابتد"))return"primary";if(t.includes("متوسط"))return"middle";if(t.includes("ثانوي"))return"secondary";return""}
function gradesMatch(s,g,ps){
 if(norm(s)===norm(g))return true;
 const a=gradeNum(s),b=gradeNum(g);if(a===null||b===null||a!==b)return false;
 const as=stage(s),bs=stage(ps||g);return !as||!bs||as===bs
}
function sectionsMatch(a,b){return normSection(a)===normSection(b)}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function date(v){if(!v)return"";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v)}
function showMessage(t){const m=document.getElementById("message");m.textContent=t;m.className="message show"}
function hideMessage(){const m=document.getElementById("message");m.textContent="";m.className="message"}

async function searchStudent(){
 hideMessage();
 const id=clean(document.getElementById("identityInput").value);
 if(!id){showMessage("فضلاً أدخل رقم الهوية.");return}
 const b=document.getElementById("searchBtn");b.disabled=true;b.textContent="جاري البحث...";
 try{
  let doc=await db.collection("students").doc(id).get();
  if(!doc.exists){
   const q=await db.collection("students").where("code","==",id).limit(1).get();
   if(!q.empty)doc=q.docs[0]
  }
  if(!doc.exists){showMessage("لم يتم العثور على طالب بهذا الرقم.");return}
  currentStudent={...(doc.data()||{}),code:(doc.data()||{}).code||doc.id};
  document.getElementById("studentName").textContent=currentStudent.name||"—";
  document.getElementById("studentGrade").textContent=currentStudent.grade||"—";
  document.getElementById("studentSection").textContent=currentStudent.section||"—";
  await loadPlans();
  renderWeeks();
  document.getElementById("studentBar").classList.add("show");
  document.getElementById("content").classList.add("show");
  document.getElementById("searchArea").style.display="none";
 }catch(e){
  console.error(e);showMessage("تعذر تحميل جدول الحصص حاليًا.");
 }finally{
  b.disabled=false;b.textContent="عرض الجدول";
 }
}

async function loadPlans(){
 const snap=await weeklyDb.collection("weeklyPlans").get();
 plans=[];
 snap.forEach(d=>{
  const x=d.data()||{};
  const w=Number(x.weekNumber);
  if(w>=1&&w<=18&&x.grade&&x.section&&gradesMatch(currentStudent.grade,x.grade,x.stage)&&sectionsMatch(currentStudent.section,x.section)){
   plans.push({id:d.id,...x});
  }
 });
 plans.sort((a,b)=>Number(a.weekNumber)-Number(b.weekNumber));
}

function renderWeeks(){
 const s=document.getElementById("weekSelect");
 const weeks=[...new Set(plans.map(x=>Number(x.weekNumber)))];
 s.innerHTML=weeks.length?weeks.map(w=>`<option value="${w}">الأسبوع ${w}</option>`).join(""):'<option value="">لا توجد أسابيع</option>';
 if(weeks.length){
  s.value=String(Math.max(...weeks));
  renderPlan(Number(s.value));
 }else{
  document.getElementById("planArea").innerHTML='<div class="empty">لا يوجد جدول حصص متاح لهذا الصف والشعبة حاليًا.</div>';
  document.getElementById("planMeta").textContent="";
 }
}

function renderPlan(week){
 const p=plans.find(x=>Number(x.weekNumber)===Number(week));
 if(!p){document.getElementById("planArea").innerHTML='<div class="empty">لا يوجد جدول لهذا الأسبوع.</div>';return}
 const labels={sunday:"الأحد",monday:"الاثنين",tuesday:"الثلاثاء",wednesday:"الأربعاء",thursday:"الخميس"};
 const days=["sunday","monday","tuesday","wednesday","thursday"];
 const rows=days.map(day=>{
  const cells=Array.from({length:8},(_,i)=>{
   const r=Array.isArray(p.days?.[day])?p.days[day][i]:null;
   return `<td class="subject">${esc(r?.subject||"—")}</td>`;
  }).join("");
  return `<tr><td class="day">${labels[day]}</td>${cells}</tr>`;
 }).join("");
 document.getElementById("planMeta").textContent=`الأسبوع ${p.weekNumber}${p.startDate&&p.endDate?` — ${date(p.startDate)} إلى ${date(p.endDate)}`:""}`;
 document.getElementById("planArea").innerHTML=`
 <div class="table-wrap">
  <table class="schedule">
   <thead><tr><th class="day-head">اليوم</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th></tr></thead>
   <tbody>${rows}</tbody>
  </table>
 </div>`;
}

document.getElementById("searchBtn").addEventListener("click",searchStudent);
document.getElementById("weekSelect").addEventListener("change",e=>renderPlan(Number(e.target.value)));
document.getElementById("identityInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchStudent()});
</script>
</body>
</html>
