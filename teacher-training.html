<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>راصد - الدورات والاجتماعات</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f6;color:#183d38}.head{position:relative;background:linear-gradient(135deg,#07463f,#0d7061);color:#fff;text-align:center;padding:18px}.logo{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.head h1{margin:6px 0}.head p{margin:0;color:#f1d479;font-weight:bold}.back,.logout{position:absolute;top:16px;border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.back{right:16px}.logout{left:16px}.wrap{max-width:1180px;margin:22px auto;padding:0 14px 36px}.welcome{padding:14px 16px;background:#e9f5f1;border:1px solid #cae4da;border-radius:12px;margin-bottom:16px;line-height:1.8}.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.course{background:#fff;border:1px solid #dce8e3;border-radius:15px;box-shadow:0 4px 16px #1232;overflow:hidden}.course-head{padding:14px 16px;background:#f1f7f4;border-bottom:1px solid #e1ebe6}.course-head h3{margin:0 0 8px;color:#07594e}.meta{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf4f2;color:#305c53;font-size:11px;font-weight:bold}.done{background:#e6f6eb;color:#16703d}.pending{background:#fff4d8;color:#785a0b}.course-body{padding:15px}.desc{font-size:13px;line-height:1.8;color:#526a65;white-space:pre-wrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:0;border-radius:9px;padding:10px 14px;font-family:inherit;font-weight:bold;cursor:pointer}.primary{background:#0e7463;color:#fff}.light{background:#edf2f0;color:#25463f}.empty{padding:45px;text-align:center;color:#71817d;background:#fff;border:1px solid #dce8e3;border-radius:12px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9999;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.modal-card{width:min(850px,98%);max-height:94vh;overflow:auto;background:#fff;border-radius:15px}.modal-head{padding:15px 18px;background:#0e6256;color:#fff;font-weight:bold}.modal-body{padding:17px}.section{margin:12px 0;padding:13px;border:1px solid #dfe9e5;border-radius:11px;background:#fbfdfc;line-height:1.9}.section h3{margin:0 0 7px;color:#0e6256;font-size:15px}.section ol{margin:0;padding-right:22px}.resource{display:inline-flex;text-decoration:none;background:#eef6f2;color:#07594e;padding:10px 13px;border-radius:9px;font-weight:bold;margin:4px}.foot{text-align:center;color:#778782;font-size:11px;padding:20px}
@media(max-width:720px){.courses{grid-template-columns:1fr}.back,.logout{position:static;margin:4px}.head{display:flex;flex-direction:column;align-items:center}.wrap{margin:14px auto}.modal-body{padding:12px}}
</style>
<link rel="stylesheet" href="rased-theme.css">
</head>
<body>
<header class="head"><button class="back" onclick="location.href='teacher.html'">← صفحة المعلم</button><img src="logo.jpeg" class="logo"><h1>مدارس الفلاح الأهلية</h1><p>الدورات والاجتماعات والمواد</p><button class="logout" onclick="logout()">تسجيل الخروج</button></header>
<main class="wrap">
<div class="welcome">مرحبًا <strong id="teacherName">المعلم</strong>. تظهر هنا المواد والاجتماعات الموجهة لك. افتح المرفق أو الرابط، ثم سجّل اطلاعك. في الاجتماع يمكنك توقيع إقرار واحد بعد الاطلاع على جميع البنود.</div>
<div id="courses" class="courses"><div class="empty">جاري تحميل المواد...</div></div>
<div class="foot">نظام راصد - مدارس الفلاح الأهلية | تصميم محمد عامر أحمد</div>
</main>
<div class="modal" id="eventModal"><div class="modal-card"><div class="modal-head" id="modalTitle"></div><div class="modal-body"><div id="modalContent"></div><div class="actions" id="modalActions"></div></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let currentUser="",currentTeacher=null,events=[],progressMap=new Map(),selectedEvent=null;
const el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function kind(c){return String(c?.eventKind||"course").toLowerCase()==="meeting"?"meeting":"course"}
function resource(c){return String(c?.fileUrl||c?.materialUrl||c?.videoUrl||"").trim()}
function lines(v){return String(v||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\s*[\d٠-٩]+\s*[-–—.)/]*\s*/,"").trim()).filter(Boolean)}
function dateText(c){const d=c.startDate||"";return d?new Intl.DateTimeFormat("ar-SA",{dateStyle:"long"}).format(new Date(d+"T12:00:00")):"بدون موعد محدد"}
function accessMessage(c){if(kind(c)==="meeting")return"";const today=new Date().toISOString().slice(0,10);if(c.startDate&&today<c.startDate)return"تبدأ إتاحة المادة في "+c.startDate;if(c.endDate&&today>c.endDate)return"انتهت إتاحة المادة في "+c.endDate;return""}
function specialties(t){const s=new Set();(Array.isArray(t?.assignments)?t.assignments:[]).forEach(a=>{if(a?.subjectId)s.add("id:"+a.subjectId);else if(a?.subjectName)s.add("name:"+String(a.subjectName).trim())});if(t?.specialty)s.add("name:"+String(t.specialty).trim());return s}
function targeted(c){const type=c.targetType||"all";if(type==="selected")return (c.targetTeacherEmails||[]).map(x=>String(x).toLowerCase()).includes(currentUser);if(type==="specialties"){const mine=specialties(currentTeacher);return (c.targetSpecialties||[]).some(x=>mine.has(String(x)))}return true}
async function protect(){const role=(localStorage.getItem("currentUserRole")||"").toLowerCase();if(role!=="teacher"){alert("هذه الصفحة للمعلمين.");location.href="index.html";return false}currentUser=(localStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||"").trim().toLowerCase();const d=await db.collection("teachers").doc(currentUser).get();if(!d.exists){alert("تعذر العثور على بيانات المعلم.");location.href="index.html";return false}currentTeacher={email:d.id,...d.data()};el("teacherName").textContent=currentTeacher.name||currentUser;return true}
async function loadAll(){const [c,p]=await Promise.all([db.collection("trainingCourses").get(),db.collection("trainingProgress").where("teacherEmail","==",currentUser).get()]);events=c.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.published!==false&&targeted(c)).sort((a,b)=>String(b.createdAt?.seconds||"").localeCompare(String(a.createdAt?.seconds||"")));progressMap=new Map(p.docs.map(d=>[d.data()?.courseId,{id:d.id,...d.data()}]));renderEvents()}
function renderEvents(){if(!events.length){el("courses").innerHTML='<div class="empty">لا توجد دورات أو اجتماعات مخصصة لك حاليًا.</div>';return}el("courses").innerHTML=events.map(c=>{const p=progressMap.get(c.id)||{},meeting=kind(c)==="meeting",signed=p.meetingSigned===true,done=meeting?signed:(p.courseAcknowledged===true||p.completed===true),seen=meeting?(p.meetingMinutesViewed===true):Number(p.visitCount||0)>0,blocked=accessMessage(c);return '<article class="course"><div class="course-head"><h3>'+esc(c.title||"بدون عنوان")+'</h3><div class="meta"><span class="badge">'+(meeting?"📅 اجتماع":"📘 دورة تدريبية")+'</span><span class="badge">'+esc(dateText(c))+'</span><span class="badge '+(done?"done":"pending")+'">'+(meeting?(signed?"✅ تم التوقيع":(seen?"👁️ تم الاطلاع":"⏳ لم يتم الاطلاع")):(done?"✅ تم الاطلاع على المادة":(seen?"📂 تم فتح المادة":"⏳ لم تفتح المادة")))+'</span></div></div><div class="course-body"><div class="desc">'+esc(c.description||"")+(blocked?'<br><b>'+esc(blocked)+'</b>':"")+'</div><div class="actions"><button class="primary" '+(blocked?"disabled":"")+' onclick="openEvent('+JSON.stringify(c.id)+')">'+(blocked?esc(blocked):(meeting?"📋 عرض بنود الاجتماع":"📘 عرض مادة الدورة"))+'</button></div></div></article>'}).join("")}
async function openEvent(id){const c=events.find(x=>x.id===id);if(!c||accessMessage(c))return;selectedEvent=c;const key=c.id+"_"+currentUser.replace(/[^a-zA-Z0-9._@-]/g,"_");const ref=db.collection("trainingProgress").doc(key);const old=progressMap.get(c.id)||{};const now=firebase.firestore.FieldValue.serverTimestamp();const patch={courseId:c.id,courseTitle:c.title||"",eventKind:kind(c),courseType:"material",teacherEmail:currentUser,teacherName:currentTeacher?.name||currentUser,lastEnteredAt:now,lastActivityAt:now,visitCount:firebase.firestore.FieldValue.increment(1)};if(!old.firstEnteredAt)patch.firstEnteredAt=now;if(kind(c)==="meeting"&&!old.meetingMinutesViewed){patch.meetingMinutesViewed=true;patch.meetingMinutesViewedAt=now}await ref.set(patch,{merge:true});await loadAll();renderModal(c);el("eventModal").classList.add("show")}
function renderModal(c){const p=progressMap.get(c.id)||{},meeting=kind(c)==="meeting",url=resource(c);el("modalTitle").textContent=(meeting?"الاجتماع: ":"الدورة: ")+(c.title||"");let html='<div class="section"><div>'+esc(c.description||"")+'</div><div style="margin-top:8px;color:#62756f">التاريخ: '+esc(dateText(c))+'</div></div>';if(url)html+='<div class="section"><h3>المرفق أو الرابط</h3><a class="resource" href="'+esc(url)+'" target="_blank" rel="noopener">📎 فتح المادة في نافذة جديدة</a></div>';else html+='<div class="section">لم يرفق ملف أو رابط لهذا العنصر بعد.</div>';if(meeting){const agenda=lines(c.meetingAgendaText),recs=lines(c.meetingRecommendationsText);html+='<div class="section"><h3>📋 بنود الاجتماع</h3>'+(agenda.length?'<ol>'+agenda.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>':"لا توجد بنود مضافة.")+'</div><div class="section"><h3>✅ التوصيات</h3>'+(recs.length?'<ol>'+recs.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ol>':"لا توجد توصيات مضافة.")+'</div><div class="section">تم تسجيل اطلاعك على البنود عند فتح هذا العرض. راجع البنود والمرفق قبل التوقيع.</div>';el("modalActions").innerHTML='<button class="primary" '+(p.meetingSigned?"disabled":"")+' onclick="signMeeting()">'+(p.meetingSigned?"✅ تم التوقيع إلكترونيًا":"✍️ توقيع إلكتروني على الاجتماع")+'</button><button class="light" onclick="closeModal()">إغلاق</button>'}else{html+='<div class="section">بعد الاطلاع على المادة، اضغط الإقرار لتسجيل إكمال الدورة.</div>';el("modalActions").innerHTML='<button class="primary" '+(p.courseAcknowledged||p.completed?"disabled":"")+' onclick="acknowledgeCourse()">'+(p.courseAcknowledged||p.completed?"✅ سبق تسجيل الاطلاع":"✅ اطلعت على مادة الدورة")+'</button><button class="light" onclick="closeModal()">إغلاق</button>'}el("modalContent").innerHTML=html}
async function signMeeting(){const c=selectedEvent;if(!c||kind(c)!=="meeting")return;if(!resource(c)&&!lines(c.meetingAgendaText).length){alert("لا توجد بنود أو مادة مضافة لهذا الاجتماع.");return;}const p=progressMap.get(c.id)||{};if(p.meetingSigned){alert("تم توقيعك على هذا الاجتماع بالفعل.");return}const name=currentTeacher?.name||currentUser;if(!confirm("أؤكد أنني اطلعت على جميع بنود الاجتماع والمرفق، وأوقع إلكترونيًا باسم:\n"+name))return;const key=c.id+"_"+currentUser.replace(/[^a-zA-Z0-9._@-]/g,"_");await db.collection("trainingProgress").doc(key).set({courseId:c.id,courseTitle:c.title||"",eventKind:"meeting",courseType:"material",teacherEmail:currentUser,teacherName:name,meetingMinutesViewed:true,meetingSigned:true,meetingSignatureName:name,meetingSignedAt:firebase.firestore.FieldValue.serverTimestamp(),lastActivityAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await loadAll();renderModal(c)}
async function acknowledgeCourse(){const c=selectedEvent;if(!c||kind(c)!=="course")return;if(!resource(c)){alert("لا توجد مادة مرفقة للاطلاع عليها.");return;}const key=c.id+"_"+currentUser.replace(/[^a-zA-Z0-9._@-]/g,"_");await db.collection("trainingProgress").doc(key).set({courseId:c.id,courseTitle:c.title||"",eventKind:"course",courseType:"material",teacherEmail:currentUser,teacherName:currentTeacher?.name||currentUser,courseAcknowledged:true,completed:true,percent:100,courseAcknowledgedAt:firebase.firestore.FieldValue.serverTimestamp(),completedAt:firebase.firestore.FieldValue.serverTimestamp(),lastActivityAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await loadAll();renderModal(c)}
function closeModal(){el("eventModal").classList.remove("show");selectedEvent=null}
function logout(){["currentUserRole","currentUser","currentUserName","currentUserEmail","currentUserType","currentUserPermissions"].forEach(k=>localStorage.removeItem(k));location.href="index.html"}
async function start(){try{if(await protect())await loadAll()}catch(e){console.error(e);alert("تعذر تحميل المواد والاجتماعات: "+e.message)}}start();
</script>
</body>
</html>
