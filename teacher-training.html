<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>راصد - دورات المعلمين</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f7fb;color:#172b3f}.head{position:relative;background:linear-gradient(135deg,#073b68,#0a5f70);color:#fff;text-align:center;padding:18px}.logo{width:75px;height:75px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.head h1{margin:5px}.head p{margin:0;color:#f4d36b;font-weight:bold}.back,.logout{position:absolute;top:16px;border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.back{right:16px}.logout{left:16px}.wrap{max-width:1180px;margin:18px auto;padding:0 12px 35px}.welcome{padding:13px 15px;background:#eaf6f3;border:1px solid #c9e4dd;border-radius:11px;color:#18564a;margin-bottom:14px}.courses{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.course{background:#fff;border:1px solid #dfe6ed;border-radius:14px;box-shadow:0 3px 14px #0001;overflow:hidden}.course-head{padding:14px 16px;background:#eef5f6;border-bottom:1px solid #dfe6ed}.course-head h3{margin:0 0 5px;color:#0d5a61}.course-body{padding:15px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef4fa;color:#174f7c;font-size:10px;font-weight:bold}.done{background:#e7f8ed;color:#14703f}.pending{background:#fff4d9;color:#7a5a00}.bar-wrap{height:15px;background:#edf2f6;border-radius:20px;overflow:hidden;margin:9px 0}.bar{height:100%;background:linear-gradient(90deg,#0f766e,#22a06b);border-radius:20px}.course button,.modal button{border:0;border-radius:8px;padding:9px 13px;font-family:inherit;font-weight:bold;cursor:pointer}.primary{background:#0f766e;color:#fff}.light{background:#e8eef3;color:#21364a}.link{background:#6f42c1;color:#fff}.empty{padding:45px;text-align:center;color:#7a8895;background:#fff;border:1px solid #e0e6ec;border-radius:12px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#000a;z-index:9999;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.modal-card{width:min(980px,99%);max-height:96vh;overflow:auto;background:#fff;border-radius:14px}.modal-head{padding:14px 17px;background:#0f5f68;color:#fff;font-weight:bold}.modal-body{padding:15px}.video-wrap{background:#000;border-radius:10px;overflow:hidden;position:relative}.video-wrap video{width:100%;max-height:62vh;display:block;background:#000}.lock-note{padding:10px 12px;border-radius:9px;background:#fff8df;border:1px solid #f0dc92;color:#725d16;font-size:12px;line-height:1.8;margin:10px 0}.progress-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:11px 0}.stat{padding:10px;border:1px solid #e0e7ee;border-radius:10px;text-align:center;background:#f8fbfd;font-size:10px;color:#64748b}.stat b{display:block;font-size:18px;color:#0f5f68;margin-top:4px}.foot{text-align:center;color:#718493;font-size:11px;padding:18px}
@media(max-width:750px){.courses{grid-template-columns:1fr}.progress-grid{grid-template-columns:1fr 1fr}.back,.logout{position:static;margin:6px}.head{display:flex;flex-direction:column;align-items:center}}
</style></head>
<body>
<header class="head"><button class="back" onclick="location.href='teacher.html'">← صفحة المعلم</button><img src="logo.jpeg" class="logo"><h1>مدارس الفلاح الأهلية</h1><p>الدورات التدريبية</p><button class="logout" onclick="logout()">تسجيل الخروج</button></header>
<div class="wrap">
<div class="welcome">مرحبًا <strong id="teacherName">المعلم</strong>. يتم تسجيل وقت الدخول ونسبة المشاهدة الفعلية للدورات المخصصة لك.</div>
<div id="courses" class="courses"><div class="empty">جاري تحميل الدورات...</div></div>
<div class="foot">نظام راصد - مدارس الفلاح الأهلية | تصميم محمد عامر أحمد</div>
</div>

<div class="modal" id="modal"><div class="modal-card"><div class="modal-head" id="modalTitle">الدورة</div><div class="modal-body">
<div id="courseDescription"></div>
<div class="lock-note" id="watchRule"></div>
<div class="video-wrap"><video id="video" controls controlsList="nodownload noplaybackrate" disablePictureInPicture playsinline></video></div>
<div class="progress-grid">
<div class="stat">المشاهدة المحسوبة<b id="pPercent">0%</b></div><div class="stat">المطلوب<b id="pRequired">70%</b></div><div class="stat">وقت مشاهدة نشط<b id="pActive">0 دقيقة</b></div><div class="stat">الحالة<b id="pStatus">قيد المشاهدة</b></div>
</div>
<div class="bar-wrap"><div class="bar" id="pBar" style="width:0%"></div></div>
<div id="materialArea"></div>
<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="light" onclick="closeCourse()">إغلاق وحفظ التقدم</button></div>
</div></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let currentUser="",currentTeacher=null,courses=[],progressMap=new Map(),currentCourse=null,progressRef=null,sessionRef=null,existingProgress={},watchedBuckets=new Set(),maxWatchedTime=0,activeWatchSeconds=0,sessionWatchSeconds=0,lastTick=0,saveTimer=null,saving=false;
const el=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function logout(){saveProgress(true);["currentUserRole","currentUser","currentUserName","currentUserEmail"].forEach(k=>localStorage.removeItem(k));location.href="index.html"}
function fmtDate(d){return d||"—"}function todayKey(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function targeted(c){return c.targetType!=="selected"||(c.targetTeacherEmails||[]).map(x=>String(x).toLowerCase()).includes(currentUser)}
function availability(c){const now=todayKey();if(c.startDate&&now<c.startDate)return {ok:false,label:"تبدأ "+c.startDate};if(c.endDate&&now>c.endDate)return {ok:false,label:"انتهت "+c.endDate};return {ok:true,label:"متاحة"}}
async function protect(){const role=(localStorage.getItem("currentUserRole")||"").toLowerCase();if(role!=="teacher"){alert("هذه الصفحة للمعلمين.");location.href="index.html";return false}currentUser=(localStorage.getItem("currentUserEmail")||localStorage.getItem("currentUser")||"").trim().toLowerCase();const d=await db.collection("teachers").doc(currentUser).get();if(!d.exists){alert("تعذر العثور على بيانات المعلم.");location.href="index.html";return false}currentTeacher={email:d.id,...d.data()};el("teacherName").textContent=currentTeacher.name||currentUser;return true}
async function loadAll(){const [c,p]=await Promise.all([db.collection("trainingCourses").get(),db.collection("trainingProgress").where("teacherEmail","==",currentUser).get()]);courses=c.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.published!==false&&targeted(c)).sort((a,b)=>String(b.startDate||"").localeCompare(String(a.startDate||"")));progressMap=new Map(p.docs.map(d=>[d.data()?.courseId,{id:d.id,...d.data()}]));renderCourses()}
function renderCourses(){if(!courses.length){el("courses").innerHTML='<div class="empty">لا توجد دورات تدريبية مخصصة لك حاليًا.</div>';return}el("courses").innerHTML=courses.map(c=>{const p=progressMap.get(c.id)||{},a=availability(c),percent=Number(p.percent||0),done=p.completed===true;return `<div class="course"><div class="course-head"><h3>${esc(c.title||"")}</h3><div class="meta"><span class="badge">${esc(fmtDate(c.startDate))} ← ${esc(fmtDate(c.endDate))}</span><span class="badge">${esc(c.requiredPercent||70)}% مطلوبة</span><span class="badge ${done?"done":"pending"}">${done?"✅ مكتملة":"⏳ غير مكتملة"}</span></div></div><div class="course-body"><div style="font-size:12px;line-height:1.8;color:#526676">${esc(c.description||"")}</div><div class="bar-wrap"><div class="bar" style="width:${Math.min(100,percent)}%"></div></div><div style="font-size:11px;margin-bottom:10px">نسبة المشاهدة المحسوبة: <b>${percent.toFixed(1)}%</b></div><button class="primary" ${a.ok?"":"disabled"} onclick='openCourse(${JSON.stringify(c.id)})'>${a.ok?"▶️ دخول الدورة":esc(a.label)}</button> ${c.materialUrl?`<button class="link" onclick='window.open(${JSON.stringify(c.materialUrl)},"_blank","noopener")'>📎 المادة الإضافية</button>`:""}</div></div>`}).join("")}
async function openCourse(id){
const c=courses.find(x=>x.id===id);if(!c||!availability(c).ok)return;currentCourse=c;const key=c.id+"_"+currentUser.replace(/[^a-zA-Z0-9._@-]/g,"_");progressRef=db.collection("trainingProgress").doc(key);const oldDoc=await progressRef.get();existingProgress=oldDoc.exists?(oldDoc.data()||{}):{};watchedBuckets=new Set(Array.isArray(existingProgress.watchedBuckets)?existingProgress.watchedBuckets.map(Number):[]);maxWatchedTime=Number(existingProgress.maxWatchedTime||0);activeWatchSeconds=Number(existingProgress.activeWatchSeconds||0);sessionWatchSeconds=0;
const now=firebase.firestore.FieldValue.serverTimestamp();const base={courseId:c.id,courseTitle:c.title||"",teacherEmail:currentUser,teacherName:currentTeacher?.name||currentUser,lastEnteredAt:now,lastActivityAt:now,visitCount:firebase.firestore.FieldValue.increment(1)};if(!oldDoc.exists)base.firstEnteredAt=now;await progressRef.set(base,{merge:true});
sessionRef=db.collection("trainingSessions").doc();await sessionRef.set({courseId:c.id,courseTitle:c.title||"",teacherEmail:currentUser,teacherName:currentTeacher?.name||currentUser,enteredAt:now,lastSeenAt:now,activeWatchSeconds:0});
el("modalTitle").textContent=c.title||"الدورة";el("courseDescription").innerHTML=`<div style="line-height:1.9">${esc(c.description||"")}</div>`;el("watchRule").innerHTML=c.preventSeeking===false?`يمكنك التنقل داخل الفيديو، لكن نسبة الإكمال تُحسب من أجزاء المشاهدة المسجلة فقط. المطلوب: <b>${c.requiredPercent||70}%</b>.`:`هذه الدورة تمنع تقديم الفيديو للأمام. يجب مشاهدة <b>${c.requiredPercent||70}%</b> على الأقل بالتسلسل حتى تُحتسب مكتملة، ويتوقف الفيديو إذا غادرت التبويب.`;
el("pRequired").textContent=(c.requiredPercent||70)+"%";el("materialArea").innerHTML=c.materialUrl?`<button class="link" onclick='window.open(${JSON.stringify(c.materialUrl)},"_blank","noopener")'>📎 فتح المادة الإضافية</button>`:"";const v=el("video");v.src=c.videoUrl||"";v.load();el("modal").classList.add("show");lastTick=Date.now();if(saveTimer)clearInterval(saveTimer);saveTimer=setInterval(()=>saveProgress(false),10000);updateUi()
}
function currentPercent(){
const v=el("video"),duration=Number(v.duration||existingProgress.videoDuration||0);if(!duration)return Number(existingProgress.percent||0);
if(currentCourse?.preventSeeking!==false)return Math.min(100,(maxWatchedTime/duration)*100);
return Math.min(100,(watchedBuckets.size*5/duration)*100)
}
function updateUi(){const pct=currentPercent(),req=Number(currentCourse?.requiredPercent||70);const duration=Number(el("video").duration||existingProgress.videoDuration||0),needSeconds=duration*req/100*.85;const done=pct>=req&&activeWatchSeconds>=needSeconds;el("pPercent").textContent=pct.toFixed(1)+"%";el("pBar").style.width=Math.min(100,pct)+"%";el("pActive").textContent=Math.round(activeWatchSeconds/60)+" دقيقة";el("pStatus").textContent=done?"✅ مكتملة":"قيد المشاهدة";return {pct,done}}
async function saveProgress(finalSave=false){
if(!currentCourse||!progressRef||saving)return;saving=true;try{const v=el("video"),duration=Number(v.duration||existingProgress.videoDuration||0),state=updateUi();const data={courseId:currentCourse.id,courseTitle:currentCourse.title||"",teacherEmail:currentUser,teacherName:currentTeacher?.name||currentUser,percent:Number(state.pct.toFixed(2)),watchedBuckets:[...watchedBuckets].sort((a,b)=>a-b),maxWatchedTime:Number(maxWatchedTime.toFixed(2)),activeWatchSeconds:Number(activeWatchSeconds.toFixed(2)),videoDuration:duration||0,completed:state.done,lastActivityAt:firebase.firestore.FieldValue.serverTimestamp()};if(state.done&&!existingProgress.completed)data.completedAt=firebase.firestore.FieldValue.serverTimestamp();await progressRef.set(data,{merge:true});existingProgress={...existingProgress,...data,completed:state.done};progressMap.set(currentCourse.id,{...existingProgress});if(sessionRef)await sessionRef.set({lastSeenAt:firebase.firestore.FieldValue.serverTimestamp(),activeWatchSeconds:Number(sessionWatchSeconds.toFixed(2)),closed:!!finalSave},{merge:true})}catch(e){console.error("TRAINING PROGRESS SAVE",e)}finally{saving=false}}
function closeCourse(){const v=el("video");v.pause();saveProgress(true);if(saveTimer){clearInterval(saveTimer);saveTimer=null}el("modal").classList.remove("show");v.removeAttribute("src");v.load();currentCourse=null;progressRef=null;sessionRef=null;loadAll()}
const video=el("video");
video.addEventListener("loadedmetadata",()=>{video.playbackRate=1;if(currentCourse?.preventSeeking!==false&&maxWatchedTime>0&&maxWatchedTime<video.duration)video.currentTime=Math.max(0,maxWatchedTime-1);lastTick=Date.now();updateUi()});
video.addEventListener("play",()=>{if(document.hidden){video.pause();return}video.playbackRate=1;lastTick=Date.now()});
video.addEventListener("ratechange",()=>{if(video.playbackRate!==1)video.playbackRate=1});
video.addEventListener("seeking",()=>{if(currentCourse?.preventSeeking!==false&&video.currentTime>maxWatchedTime+2.5)video.currentTime=Math.max(0,maxWatchedTime)});
video.addEventListener("timeupdate",()=>{if(!currentCourse||video.paused||document.hidden)return;if(currentCourse.preventSeeking!==false&&video.currentTime>maxWatchedTime+3){video.currentTime=Math.max(0,maxWatchedTime);return}const now=Date.now(),dt=Math.max(0,Math.min(1.5,(now-lastTick)/1000));lastTick=now;activeWatchSeconds+=dt;sessionWatchSeconds+=dt;watchedBuckets.add(Math.floor(video.currentTime/5));if(currentCourse.preventSeeking!==false)maxWatchedTime=Math.max(maxWatchedTime,video.currentTime);else maxWatchedTime=Math.max(maxWatchedTime,video.currentTime);updateUi()});
video.addEventListener("pause",()=>saveProgress(false));video.addEventListener("ended",()=>saveProgress(false));
document.addEventListener("visibilitychange",()=>{if(document.hidden&&!video.paused)video.pause()});
window.addEventListener("blur",()=>{if(currentCourse&&!video.paused)video.pause()});
window.addEventListener("beforeunload",()=>{if(currentCourse)saveProgress(true)});
async function start(){try{if(!await protect())return;await loadAll()}catch(e){console.error(e);alert("تعذر تحميل الدورات:\n"+e.message)}}start();
</script></body></html>
