<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>راصد - تغيير كلمة المرور</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#eef3f7,#f8f4e8);
  color:#172b3f;
}
.head{
  background:linear-gradient(135deg,#073653,#0b5d92);
  color:#fff;
  text-align:center;
  padding:22px 15px;
  border-bottom:4px solid #caa33b;
}
.logo{
  width:82px;height:82px;object-fit:contain;
  background:#fff;border-radius:50%;padding:5px
}
.head h1{margin:8px 0 3px;font-size:23px}
.head p{margin:0;color:#f4d77b;font-weight:bold}
.wrap{max-width:620px;margin:28px auto;padding:0 14px 35px}
.card{
  background:#fff;border:1px solid #dce5ec;border-radius:16px;
  box-shadow:0 8px 28px #00000014;overflow:hidden
}
.title{
  padding:15px 18px;background:#eef4fa;color:#123c63;
  font-size:18px;font-weight:900;border-bottom:1px solid #dce5ec
}
.body{padding:18px}
.account{
  background:#f7fafc;border:1px solid #e1e8ef;border-radius:11px;
  padding:12px 14px;margin-bottom:15px;line-height:1.9
}
.account b{color:#0b4b78}
label{display:block;font-weight:bold;font-size:12px;margin:11px 0 5px;color:#29465a}
.input-wrap{position:relative}
input{
  width:100%;height:46px;border:1px solid #cbd5e1;border-radius:9px;
  padding:10px 44px 10px 11px;font-family:inherit;font-size:14px
}
.toggle{
  position:absolute;left:7px;top:6px;height:34px;
  border:0;border-radius:7px;background:#edf2f6;cursor:pointer
}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
button{
  border:0;border-radius:9px;padding:11px 16px;
  font-family:inherit;font-weight:bold;cursor:pointer
}
.primary{background:#0b5d92;color:#fff}
.light{background:#e8eef3;color:#21364a}
.note{
  margin-top:14px;padding:10px 12px;border-radius:9px;
  background:#fff8df;border:1px solid #ead78d;color:#6f5a13;
  font-size:12px;line-height:1.8
}
.state{
  display:none;margin-bottom:12px;padding:10px 12px;border-radius:9px;
  font-size:12px;font-weight:bold
}
.state.ok{display:block;background:#e9f8ef;color:#146b3a;border:1px solid #bfe4cd}
.state.err{display:block;background:#fdecec;color:#9f2424;border:1px solid #efc1c1}
.foot{text-align:center;color:#718493;font-size:11px;padding:18px}
</style>
</head>

<body>

<header class="head">
  <img src="logo.jpeg" class="logo" alt="شعار مدارس الفلاح">
  <h1>مدارس الفلاح الأهلية</h1>
  <p>نظام راصد - تغيير كلمة المرور</p>
</header>

<div class="wrap">
  <div class="card">
    <div class="title">🔐 تغيير كلمة المرور الخاصة بي</div>
    <div class="body">

      <div class="account">
        <div>الاسم: <b id="accountName">جاري التحميل...</b></div>
        <div>اسم المستخدم: <b id="accountUsername">...</b></div>
        <div>نوع الحساب: <b id="accountRole">...</b></div>
      </div>

      <div id="state" class="state"></div>

      <label>كلمة المرور الحالية</label>
      <div class="input-wrap">
        <input id="currentPassword" type="password" autocomplete="current-password">
        <button class="toggle" type="button" onclick="togglePassword('currentPassword',this)">👁</button>
      </div>

      <label>كلمة المرور الجديدة</label>
      <div class="input-wrap">
        <input id="newPassword" type="password" autocomplete="new-password">
        <button class="toggle" type="button" onclick="togglePassword('newPassword',this)">👁</button>
      </div>

      <label>تأكيد كلمة المرور الجديدة</label>
      <div class="input-wrap">
        <input id="confirmPassword" type="password" autocomplete="new-password">
        <button class="toggle" type="button" onclick="togglePassword('confirmPassword',this)">👁</button>
      </div>

      <div class="actions">
        <button class="primary" id="saveBtn" onclick="changeMyPassword()">💾 حفظ كلمة المرور الجديدة</button>
        <button class="light" onclick="goBack()">← رجوع</button>
      </div>

      <div class="note">
        يتم تغيير كلمة مرور <strong>الحساب المسجل دخوله حاليًا فقط</strong>.
        بعد الحفظ سيتم تسجيل الخروج تلقائيًا، ثم تدخل بكلمة المرور الجديدة.
      </div>

    </div>
  </div>

  <div class="foot">نظام راصد - مدارس الفلاح الأهلية</div>
</div>

<script>
const firebaseConfig={
  apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",
  authDomain:"results2026-7c0dd.firebaseapp.com",
  projectId:"results2026-7c0dd",
  storageBucket:"results2026-7c0dd.firebasestorage.app",
  messagingSenderId:"241421115694",
  appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const el=id=>document.getElementById(id);
let accountRef=null;
let accountData=null;
let accountUsername="";

function roleLabel(role,type){
  role=String(role||"").toLowerCase();
  type=String(type||"").toLowerCase();
  if(role==="teacher")return "معلم";
  if(role==="activity_leader")return "رائد نشاط";
  if(role==="student_counselor")return "موجه طلابي";
  if(role==="monitor")return "متابعة";
  if(role==="admin"||role==="superadmin")return "أدمن";
  if(role==="supervisor"){
    return {
      general_supervisor:"مشرف عام",
      manager:"مدير",
      deputy:"وكيل",
      supervisor:"مشرف"
    }[type]||"إشراف";
  }
  return role||"حساب راصد";
}

function showState(message,type="err"){
  const n=el("state");
  n.textContent=message;
  n.className="state "+type;
}

function togglePassword(id,btn){
  const input=el(id);
  input.type=input.type==="password"?"text":"password";
  btn.textContent=input.type==="password"?"👁":"🙈";
}

async function findCurrentUserDoc(username){
  const original=String(username||"").trim();
  if(!original)return null;

  let d=await db.collection("users").doc(original).get();
  if(d.exists)return {ref:d.ref,doc:d,username:original};

  const lower=original.toLowerCase();
  if(lower!==original){
    d=await db.collection("users").doc(lower).get();
    if(d.exists)return {ref:d.ref,doc:d,username:lower};
  }
  return null;
}

function returnUrl(){
  const p=new URLSearchParams(location.search);
  const supplied=String(p.get("return")||"").trim();

  // لا نسمح بروابط خارجية.
  if(supplied && !/^https?:\/\//i.test(supplied) && !supplied.startsWith("//")){
    return supplied;
  }

  const role=String(localStorage.getItem("currentUserRole")||"").toLowerCase();
  if(role==="teacher")return "teacher.html";
  if(role==="supervisor")return "supervisor-dashboard.html";
  if(role==="student_counselor")return "student-counselor.html";
  if(role==="activity_leader")return "activity-leader.html";
  if(role==="monitor")return "monitor-dashboard.html";
  if(role==="admin"||role==="superadmin")return "admin.html";
  return "index.html";
}

function goBack(){
  location.href=returnUrl();
}

function clearSession(){
  [
    "currentUserRole",
    "currentUser",
    "currentUserName",
    "currentUserEmail",
    "currentUserType",
    "currentUserPermissions",
    "currentAssignedTeacherEmails"
  ].forEach(k=>localStorage.removeItem(k));
}

async function init(){
  const username=String(
    localStorage.getItem("currentUserEmail")||
    localStorage.getItem("currentUser")||
    ""
  ).trim();

  if(!username){
    alert("يجب تسجيل الدخول أولًا.");
    location.href="index.html";
    return;
  }

  try{
    const found=await findCurrentUserDoc(username);
    if(!found){
      showState("تعذر العثور على حسابك داخل نظام المستخدمين. سجّل الخروج ثم ادخل بالحساب مرة أخرى.");
      el("saveBtn").disabled=true;
      return;
    }

    accountRef=found.ref;
    accountData=found.doc.data()||{};
    accountUsername=found.username;

    el("accountName").textContent=
      accountData.name||
      localStorage.getItem("currentUserName")||
      accountUsername;

    el("accountUsername").textContent=accountUsername;
    el("accountRole").textContent=roleLabel(
      accountData.role,
      accountData.supervisorType
    );
  }catch(e){
    console.error(e);
    showState("تعذر تحميل بيانات الحساب: "+e.message);
  }
}

async function changeMyPassword(){
  if(!accountRef||!accountData){
    showState("تعذر تحميل الحساب.");
    return;
  }

  const current=el("currentPassword").value;
  const next=el("newPassword").value.trim();
  const confirm=el("confirmPassword").value.trim();

  if(!current||!next||!confirm){
    showState("أدخل كلمة المرور الحالية والجديدة والتأكيد.");
    return;
  }

  if(String(accountData.password??"")!==String(current)){
    showState("كلمة المرور الحالية غير صحيحة.");
    return;
  }

  if(next.length<4){
    showState("كلمة المرور الجديدة يجب ألا تقل عن 4 أحرف.");
    return;
  }

  if(next!==confirm){
    showState("كلمة المرور الجديدة وتأكيدها غير متطابقين.");
    return;
  }

  if(next===current){
    showState("اختر كلمة مرور جديدة مختلفة عن الحالية.");
    return;
  }

  const btn=el("saveBtn");
  btn.disabled=true;
  btn.textContent="جاري الحفظ...";

  try{
    // قراءة حديثة قبل التعديل للتأكد أن كلمة المرور لم تتغير من جلسة أخرى.
    const fresh=await accountRef.get();
    if(!fresh.exists){
      throw new Error("الحساب لم يعد موجودًا.");
    }

    const freshData=fresh.data()||{};
    if(String(freshData.password??"")!==String(current)){
      showState("تم تغيير كلمة المرور من جلسة أخرى. سجّل الدخول من جديد.");
      btn.disabled=false;
      btn.textContent="💾 حفظ كلمة المرور الجديدة";
      return;
    }

    await accountRef.update({
      password:next,
      passwordChangedAt:firebase.firestore.FieldValue.serverTimestamp(),
      passwordChangedBySelf:true
    });

    showState("تم تغيير كلمة المرور بنجاح ✅ سيتم تسجيل خروجك الآن.","ok");

    setTimeout(()=>{
      clearSession();
      location.href="index.html";
    },1200);

  }catch(e){
    console.error(e);
    showState("تعذر تغيير كلمة المرور: "+e.message);
    btn.disabled=false;
    btn.textContent="💾 حفظ كلمة المرور الجديدة";
  }
}

document.addEventListener("DOMContentLoaded",init);
</script>

</body>
</html>
