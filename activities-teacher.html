<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد - أنشطة المعلم</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f6f9;color:#172b3f}.header{background:linear-gradient(135deg,#06365f,#0a558b);color:#fff;padding:16px;text-align:center}.logo{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.container{width:min(1180px,96%);margin:20px auto}.card{background:#fff;border:1px solid #dfe6ec;border-radius:14px;margin-bottom:18px;box-shadow:0 3px 14px rgba(0,0,0,.06);overflow:hidden}.title{padding:15px 18px;background:#eef4fa;color:#0a4779;font-weight:bold;font-size:18px}.body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;font-family:inherit;background:#fff}textarea{min-height:110px;resize:vertical}.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.class-item{border:1px solid #dbe5ef;border-radius:8px;padding:9px;background:#fafcff}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.btn{border:0;border-radius:8px;padding:11px 16px;font-weight:bold;cursor:pointer}.primary{background:#174f7c;color:#fff}.gold{background:#d6a821;color:#173b5d}.green{background:#198754;color:#fff}.light{background:#e9eef4}.danger{background:#dc3545;color:#fff}.status{display:inline-block;padding:5px 10px;border-radius:18px;background:#eef4fa;font-weight:bold}.activity{border:1px solid #dfe6ec;border-radius:10px;padding:14px;margin-bottom:10px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.muted{color:#6b7280;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.photos{grid-template-columns:1fr}}</style></head><body>
<header class="header"><img src="logo.jpeg" class="logo"><h1>مدارس الفلاح الأهلية</h1><div>نظام راصد - الأنشطة والتقارير</div></header>
<div class="container"><div class="actions"><button class="btn light" onclick="history.back()">← العودة لصفحة المعلم</button></div>
<div class="card"><div class="title">🎯 إنشاء نشاط جديد</div><div class="body"><input type="hidden" id="editId"><div class="grid">
<div><label>اسم النشاط</label><input id="title"></div><div><label>نوع النشاط</label><select id="type"><option>صفي</option><option>لا صفي</option><option>مسابقة</option><option>برنامج</option><option>زيارة</option><option>فعالية</option><option>أخرى</option></select></div>
<div><label>اليوم</label><input id="day" placeholder="مثال: الأحد"></div><div><label>التاريخ</label><input type="date" id="date"></div>
<div><label>المكان</label><input id="location"></div><div><label>وقت التنفيذ (اختياري)</label><input type="time" id="time"></div>
<div><label>المادة (اختياري)</label><select id="subject"><option value="">بدون مادة محددة</option></select></div><div><label>عدد الطلاب المشاركين (اختياري)</label><input type="number" min="0" id="participants"></div>
<div class="full"><label>الفصول المستهدفة</label><div id="classes" class="classes"></div></div>
<div class="full"><label>وصف النشاط / نبذة التنفيذ</label><textarea id="description"></textarea></div><div class="full"><label>أهداف النشاط</label><textarea id="objectives"></textarea></div><div class="full"><label>ملاحظات (اختياري)</label><textarea id="notes"></textarea></div>
<div class="full"><label>صور النشاط (من 1 إلى 3 صور)</label><input type="file" id="images" accept="image/*" multiple><div class="muted">الحد الأقصى 3 صور.</div></div></div>
<div class="actions"><button class="btn primary" onclick="saveActivity(false)">💾 حفظ مسودة</button><button class="btn green" onclick="saveActivity(true)">📤 حفظ وإرسال للمشرف</button><button class="btn light" onclick="resetForm()">جديد</button></div><div id="msg" class="muted"></div></div></div>
<div class="card"><div class="title">📋 تقاريري وأنشطتي</div><div class="body"><div id="list">جاري التحميل...</div></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const supabaseClient=window.supabase.createClient("https://xalqjwuewdgxrxuejqyg.supabase.co","sb_publishable_BJozLqjByOtWcLi3Zb_MPg_pzNwV8jb");const BUCKET="rased-files";let teacher=null,username="",assignments=[],activities=[];const el=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function protect(){if((localStorage.getItem('currentUserRole')||'')!=='teacher'){alert('هذه الصفحة للمعلمين فقط');location.href='index.html';return false}return true}
async function loadTeacher(){username=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();const d=await db.collection('teachers').doc(username).get();if(!d.exists)throw Error('تعذر تحميل بيانات المعلم');teacher={email:d.id,...d.data()};assignments=Array.isArray(teacher.assignments)?teacher.assignments:[];renderSelectors()}
function renderSelectors(){const subs=new Map();assignments.forEach(a=>{if(a.subjectId)subs.set(a.subjectId,a.subjectName||'المادة')});el('subject').innerHTML='<option value="">بدون مادة محددة</option>'+[...subs].map(([id,n])=>`<option value="${esc(id)}">${esc(n)}</option>`).join('');const seen=new Set();const arr=[];assignments.forEach(a=>{const k=a.grade+'|||'+a.section;if(a.grade&&a.section&&!seen.has(k)){seen.add(k);arr.push(a)}});el('classes').innerHTML=arr.map(a=>`<label class="class-item"><input type="checkbox" class="cls" data-grade="${esc(a.grade)}" data-section="${esc(a.section)}"> ${esc(a.grade)} / ${esc(a.section)}</label>`).join('')||'لا توجد فصول مسندة.'}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function compressActivityImage(file){
  if(!file || !/^image\/(jpeg|jpg|png|webp)$/i.test(file.type||'')) return file;
  if(file.size<=900*1024) return file;
  return new Promise(resolve=>{
    const img=new Image();
    const objectUrl=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const maxSide=1600;
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        const scale=Math.min(1,maxSide/Math.max(w,h));
        w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));
        const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          URL.revokeObjectURL(objectUrl);
          if(!blob){resolve(file);return}
          resolve(new File([blob],(file.name.replace(/\.[^.]+$/,'')||'activity')+'.jpg',{type:'image/jpeg',lastModified:Date.now()}));
        },'image/jpeg',0.8);
      }catch(e){URL.revokeObjectURL(objectUrl);resolve(file)}
    };
    img.onerror=()=>{URL.revokeObjectURL(objectUrl);resolve(file)};
    img.src=objectUrl;
  });
}
async function uploadActivityFile(file,path){
  let lastError=null;
  for(let attempt=1;attempt<=2;attempt++){
    try{
      const result=await supabaseClient.storage.from(BUCKET).upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
      if(result.error)throw result.error;
      return result.data;
    }catch(e){lastError=e;if(attempt<2)await wait(900)}
  }
  throw lastError||new Error('تعذر رفع الصورة');
}
async function uploadImages(files){
  const out=[];
  const teacherFolder=String(username||'teacher').replace(/[^a-zA-Z0-9_-]/g,'_');
  for(let i=0;i<files.length;i++){
    const original=files[i];
    el('msg').textContent='جاري تجهيز ورفع الصورة '+(i+1)+' من '+files.length+'...';
    const prepared=await compressActivityImage(original);
    const rawExt=(prepared.name.split('.').pop()||'jpg');
    const ext=rawExt.replace(/[^a-zA-Z0-9]/g,'').toLowerCase().slice(0,8)||'jpg';
    // نفس بنية المجلد المستخدمة في رفع ملفات المعلم القديمة لتفادي تعارض سياسات Storage
    const path=teacherFolder+'/activity_'+Date.now()+'_'+Math.random().toString(36).slice(2,9)+'.'+ext;
    const data=await uploadActivityFile(prepared,path);
    const publicResult=supabaseClient.storage.from(BUCKET).getPublicUrl(data.path);
    const url=publicResult?.data?.publicUrl||'';
    if(!url)throw new Error('تم رفع الصورة لكن تعذر إنشاء رابطها العام.');
    out.push({url,name:original.name,path:data.path});
  }
  return out;
}
function getClasses(){return [...document.querySelectorAll('.cls:checked')].map(x=>({grade:x.dataset.grade,section:x.dataset.section}))}
async function saveActivity(submit){const id=el('editId').value;const old=id?activities.find(x=>x.id===id):null;if(old&&['submitted','reviewed','published'].includes(old.status)){alert('التقرير المرسل للمشرف لا يمكن تعديله إلا بعد إعادته للتعديل.');return}const title=el('title').value.trim(),date=el('date').value,location=el('location').value.trim(),classes=getClasses();if(!title||!date||!location||!classes.length){alert('أدخل اسم النشاط والتاريخ والمكان واختر فصلًا واحدًا على الأقل.');return}const files=[...el('images').files];if(files.length>3){alert('الحد الأقصى 3 صور');return}el('msg').textContent='جاري الحفظ...';try{let imgs=old?.images||[];if(files.length)imgs=await uploadImages(files);if(!imgs.length){alert('ارفع صورة واحدة على الأقل للنشاط.');el('msg').textContent='';return}const sid=el('subject').value;const subj=assignments.find(a=>String(a.subjectId)===String(sid));const now=firebase.firestore.FieldValue.serverTimestamp();const data={title,type:el('type').value,day:el('day').value.trim(),date,location,time:el('time').value,subjectId:sid,subjectName:subj?.subjectName||'',classes,description:el('description').value.trim(),objectives:el('objectives').value.trim(),notes:el('notes').value.trim(),participantsCount:Number(el('participants').value||0)||null,images:imgs,teacherEmail:username,teacherName:teacher?.name||'',status:submit?'submitted':'draft',updatedAt:now};if(!id){data.createdAt=now;data.history=[{status:submit?'submitted':'draft',label:submit?'تم الإرسال للمشرف':'تم إنشاء المسودة',at:new Date().toISOString(),by:teacher?.name||username}]}else{data.history=[...(old?.history||[]),{status:submit?'submitted':'draft',label:submit?'تم الإرسال للمشرف':'تم تحديث المسودة',at:new Date().toISOString(),by:teacher?.name||username}]}
if(submit)data.submittedAt=now; if(id)await db.collection('activities').doc(id).set(data,{merge:true});else await db.collection('activities').add(data);resetForm();await loadActivities();el('msg').textContent='تم الحفظ بنجاح ✅'}catch(e){console.error('ACTIVITY SAVE ERROR',e);const msg=(e&&e.message)?e.message:String(e||'');if(/failed to fetch|fetch failed|network/i.test(msg)){alert('تعذر الاتصال بخدمة رفع الصور.\n\nتم ضغط الصور وإعادة المحاولة تلقائيًا لكن الاتصال لم يكتمل. تأكد من الإنترنت ثم جرّب مرة أخرى.');}else{alert('تعذر الحفظ: '+msg)}el('msg').textContent=''} }
async function loadActivities(){const s=await db.collection('activities').where('teacherEmail','==',username).get();activities=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));renderList()}
function statusLabel(s){return {draft:'مسودة',submitted:'مرسل للمشرف',reviewed:'تمت المراجعة',revision_requested:'معاد للتعديل',published:'منشور لولي الأمر'}[s]||s}
function renderList(){el('list').innerHTML=activities.map(a=>`<div class="activity"><div><strong>${esc(a.title)}</strong> <span class="status">${esc(statusLabel(a.status))}</span></div><div class="muted">${esc(a.date)} • ${esc(a.location)} • ${(a.classes||[]).map(c=>esc(c.grade+' / '+c.section)).join('، ')}</div><div class="actions"><button class="btn primary" onclick="location.href='activity-report.html?id=${a.id}'">📄 عرض التقرير</button>${['draft','revision_requested'].includes(a.status)?`<button class="btn gold" onclick="editActivity('${a.id}')">✏️ تعديل</button>`:''}${a.status==='draft'?`<button class="btn danger" onclick="deleteActivity('${a.id}')">🗑️ حذف</button>`:''}</div></div>`).join('')||'لا توجد أنشطة حتى الآن.'}
function editActivity(id){const a=activities.find(x=>x.id===id);if(!a)return;el('editId').value=id;['title','type','day','date','location','time','description','objectives','notes'].forEach(k=>{if(el(k))el(k).value=a[k]||''});el('participants').value=a.participantsCount||'';el('subject').value=a.subjectId||'';document.querySelectorAll('.cls').forEach(x=>x.checked=(a.classes||[]).some(c=>c.grade===x.dataset.grade&&c.section===x.dataset.section));scrollTo({top:0,behavior:'smooth'})}
async function deleteActivity(id){if(!confirm('حذف المسودة؟'))return;await db.collection('activities').doc(id).delete();await loadActivities()}
function resetForm(){el('editId').value='';document.querySelectorAll('input:not([type=checkbox]),textarea').forEach(x=>{if(x.id!=='editId')x.value=''});document.querySelectorAll('.cls').forEach(x=>x.checked=false);el('type').selectedIndex=0;el('subject').value=''}
(async()=>{if(!protect())return;try{await loadTeacher();await loadActivities()}catch(e){alert(e.message)}})();
</script></body></html>
