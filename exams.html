us:7px;background:#fff}.image-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.86);align-items:center;justify-content:center;padding:24px}.image-lightbox:not(.hidden){display:flex}.image-lightbox-img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);cursor:zoom-out}.image-lightbox-close{position:absolute;top:14px;right:18px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#123c63;font-size:30px;line-height:1;cursor:pointer}.passage{padding:12px;background:#f8fafc;border:1px solid #d7e0e8;border-radius:8px;line-height:1.9;margin:10px 0}.question-image{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:12px auto;border:1px solid #d7e0e8;border-radius:10px;background:#fff}.q[dir="ltr"]{text-align:left}.q[dir="rtl"]{text-align:right}.q[dir="ltr"] .opt{text-align:left}.q[dir="rtl"] .opt{text-align:right}.timer{text-align:center;color:#dc3545;font-size:20px;font-weight:bold}.deadline-open{color:#198754;font-weight:bold}.deadline-ended{color:#dc3545;font-weight:bold}.footer{text-align:center;color:#687786;font-size:11px;padding:15px}

<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let st=null,ex=null,qs=[],left=0,timerId=null;
function view(x){["login","list","take","result"].forEach(i=>document.getElementById(i).classList.toggle("hidden",i!==x))}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function normalizeArabicDigits(v){
 return String(v??"")
   .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
   .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
}

function normalizeTargetText(v){
 return normalizeArabicDigits(v)
   .trim()
   .toLowerCase()
   .replace(/[أإآ]/g,"ا")
   .replace(/ى/g,"ي")
   .replace(/ة/g,"ه")
   .replace(/[\u064B-\u065F\u0670]/g,"")
   .replace(/[\/\\|,_\-–—]+/g," ")
   .replace(/\s+/g," ")
   .trim();
}

function normalizeSectionValue(v){
 const x=normalizeTargetText(v)
   .replace(/^الشعبه\s*/,"")
   .replace(/^شعبه\s*/,"")
   .trim();

 const map={
   "a":"ا","1":"ا","ا":"ا",
   "b":"ب","2":"ب","ب":"ب",
   "c":"ج","3":"ج","ج":"ج",
   "d":"د","4":"د","د":"د"
 };
 return map[x]||x;
}

function normalizeGradeValue(v){
 let x=normalizeTargetText(v);

 // توحيد الصيغ الشائعة مثل "الصف الخامس الابتدائي" و "5 ابتدائي".
 x=x
   .replace(/^الصف\s*/,"")
   .replace(/\bالمرحله\b/g,"")
   .replace(/\bالمرحلة\b/g,"")
   .replace(/\s+/g," ")
   .trim();

 const ordinals={
   "الاول":"1","اول":"1",
   "الثاني":"2","ثاني":"2",
   "الثالث":"3","ثالث":"3",
   "الرابع":"4","رابع":"4",
   "الخامس":"5","خامس":"5",
   "السادس":"6","سادس":"6"
 };

 for(const [word,num] of Object.entries(ordinals)){
   x=x.replace(new RegExp(`(^|\\s)${word}(?=\\s|$)`,"g"),`$1${num}`);
 }

 x=x
   .replace(/\bابتدائيه\b/g,"ابتدائي")
   .replace(/\bابتدايي\b/g,"ابتدائي")
   .replace(/\bمتوسطه\b/g,"متوسط")
   .replace(/\bثانويه\b/g,"ثانوي")
   .replace(/\s+/g," ")
   .trim();

 return x;
}

function sameStudentCode(a,b){
 return normalizeArabicDigits(a).trim()===normalizeArabicDigits(b).trim();
}

function sameClass(gradeA,sectionA,gradeB,sectionB){
 return (
   normalizeGradeValue(gradeA)===normalizeGradeValue(gradeB) &&
   normalizeSectionValue(sectionA)===normalizeSectionValue(sectionB)
 );
}

function targets(e){
 const mode=String(e?.targetType||"").toLowerCase().trim();
 const myCodes=[
   st?.code,
   st?._loginCode,
   st?._docId
 ].map(v=>String(v||"").trim()).filter(Boolean);

 // 1) طالب/طلاب محددون: نتحقق من كود الطالب ورقم الدخول ومعرف مستند الطالب.
 const studentCodes=[];

 if(Array.isArray(e?.targetStudentCodes)){
   studentCodes.push(...e.targetStudentCodes);
 }

 if(Array.isArray(e?.targetStudents)){
   studentCodes.push(...e.targetStudents.map(s=>s?.code||s?.studentCode||s?.id||""));
 }

 if(e?.targetStudentCode){
   studentCodes.push(e.targetStudentCode);
 }

 if(studentCodes.some(code=>myCodes.some(myCode=>sameStudentCode(code,myCode)))){
   return true;
 }

 // دعم إضافي للاختبارات التي خزنت بيانات الطالب بالاسم/الفصل بدل الكود.
 const targetPeople=Array.isArray(e?.targetStudents)?e.targetStudents:[];
 const myName=normalizeTargetText(st?.name||"");
 const targetByIdentity=targetPeople.some(s=>
   myName &&
   normalizeTargetText(s?.name||"")===myName &&
   sameClass(
     s?.grade||"",
     s?.section||"",
     st?.grade||"",
     st?.section||""
   )
 );

 if(targetByIdentity){
   return true;
 }

 if(
   e?.targetStudentName &&
   myName &&
   normalizeTargetText(e.targetStudentName)===myName &&
   sameClass(
     e?.targetStudentGrade||st?.grade||"",
     e?.targetStudentSection||st?.section||"",
     st?.grade||"",
     st?.section||""
   )
 ){
   return true;
 }

 // 2) فصل أو فصول: مطابقة مرنة بدل المطابقة النصية الحرفية.
 const classes=Array.isArray(e?.classes)?e.classes:[];

 const classMatched=classes.some(c=>{
   if(typeof c==="string"){
     // دعم أي بيانات قديمة محفوظة كنص "5 ابتدائي / أ".
     const raw=normalizeTargetText(c);
     const myGrade=normalizeGradeValue(st?.grade||"");
     const mySection=normalizeSectionValue(st?.section||"");
     return raw.includes(myGrade) && raw.endsWith(mySection);
   }

   return sameClass(
     c?.grade||c?.classGrade||"",
     c?.section||c?.classSection||"",
     st?.grade||"",
     st?.section||""
   );
 });

 if(classMatched){
   return true;
 }

 // 3) لو لم يُحدد أي مستهدف فعليًا فلا يظهر الاختبار.
 if(mode==="none"){
   return false;
 }

 // لا نربط الظهور بدور منشئ الاختبار؛ المعلم والمشرف يعاملان بنفس الطريقة.
 return false;
}
function questionDir(q){
 let d=q?.textDirection||"auto";
 if(d==="rtl"||d==="ltr")return d;
 return /[\u0600-\u06FF]/.test(String(q?.text||""))?"rtl":"ltr";
}
async function loginStudent(){
 let c=code.value.trim();
 if(!c)return alert("أدخل رقم هوية الطالب.");

 let d=await db.collection("students").doc(c).get();

 if(d.exists){
   const data=d.data()||{};
   st={
     ...data,
     code:String(data.code||d.id),
     _loginCode:String(c),
     _docId:String(d.id)
   };
 }else{
   let q=await db.collection("students").where("code","==",c).limit(1).get();
   if(!q.empty){
     let x=q.docs[0],data=x.data()||{};
     st={
       ...data,
       code:String(data.code||x.id),
       _loginCode:String(c),
       _docId:String(x.id)
     };
   }
 }

 if(!st)return alert("رقم الهوية غير مسجل.");

 student.innerHTML=`<div class="info"><b>${esc(st.name)}</b><br>${esc(st.grade)} / ${esc(st.section)}</div>`;
 await loadExams();
}
function publishStarted(e){
 if(!e?.publishAt)return true;
 const t=new Date(e.publishAt).getTime();
 return !Number.isFinite(t)||Date.now()>=t;
}
function publishText(e){
 if(!e?.publishAt)return "";
 const d=new Date(e.publishAt);
 if(Number.isNaN(d.getTime()))return "";
 return d.toLocaleString("ar-SA");
}
function deadlineEnded(e){
 if(!e?.deadline)return false;
 const t=new Date(e.deadline).getTime();
 return Number.isFinite(t)&&Date.now()>t;
}
function deadlineText(e){
 if(!e?.deadline)return "بدون موعد نهائي";
 const d=new Date(e.deadline);
 if(Number.isNaN(d.getTime()))return "بدون موعد نهائي";
 return d.toLocaleString("ar-SA");
}
async function loadExams(){
 view("list");let s=await db.collection("onlineExams").get();let arr=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.active!==false&&targets(e)&&publishStarted(e));
 let a=await db.collection("examAttempts").where("studentCode","==",String(st.code)).get(),all=a.docs.map(d=>d.data());
 exams.innerHTML=arr.length?arr.map(e=>{
   let used=all.filter(x=>x.examId===e.id).length,max=(e.maxAttempts===undefined?1:Number(e.maxAttempts)),attemptAllowed=max===0||used<max,ended=deadlineEnded(e);
   let action=ended?'<div class="deadline-ended">🔴 انتهى موعد الاختبار</div>':(attemptAllowed?`<button onclick="startExam('${e.id}')">بدء التدريب</button>`:'<b>اكتملت المحاولات المسموحة</b>');
   let deadlineLine=e.deadline?`<br>آخر موعد: ${esc(deadlineText(e))}`:"";
   return `<div class="exam"><b>${esc(e.name)}</b><br>${esc(e.subjectName||"English")} — ${esc(e.durationMinutes||0)} دقيقة — ${esc(e.fullMark||0)} درجة${deadlineLine}<br>المحاولات: ${used}${max===0?" / غير محدود":" / "+max}<br>${action}</div>`
 }).join(""):"<div class='info'>لا توجد اختبارات متاحة حاليًا.</div>";
}

function normalized(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function openExamImageFromElement(image){
 const lightbox=document.getElementById("imageLightbox");
 const target=document.getElementById("imageLightboxImg");
 if(!lightbox||!target||!image)return;
 target.src=image.currentSrc||image.src||"";
 target.alt=image.alt||"صورة الاختبار";
 lightbox.classList.remove("hidden");
}
function closeExamImageNow(){
 const lightbox=document.getElementById("imageLightbox");
 const target=document.getElementById("imageLightboxImg");
 if(target)target.removeAttribute("src");
 if(lightbox)lightbox.classList.add("hidden");
}
function closeExamImage(event){
 if(!event||event.target===event.currentTarget)closeExamImageNow();
}
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeExamImageNow()});
function pairImage(pair,side){
 return String(pair?.[side+"ImageUrl"]||pair?.[side+"Image"]||pair?.[side+"ImageData"]||"");
}
function chooseMatchAnswer(button,qid,index,value){
 const select=document.querySelector(`.match-answer[data-q="${CSS.escape(qid)}"][data-index="${index}"]`);
 if(select){select.value=String(value);button.parentElement.querySelectorAll(".match-preview").forEach(x=>x.classList.remove("selected"));button.classList.add("selected");}
}
function renderStudentQuestion(q,i,seenPassages){
 let t=q.type||"mcq",d=questionDir(q),body="";
 if(q.imageUrl)body+=`<img class="question-image zoomable-image" src="${esc(q.imageUrl)}" alt="صورة السؤال" onclick="openExamImageFromElement(this);event.stopPropagation()">`;

 if(t==="reading"&&q.passage){
   const group=String(q.passageGroupId||q.id||("reading_"+i));
   if(!seenPassages.has(group)){
     seenPassages.add(group);
     body+=`<div class="passage">${q.passageTitle?`<div class="passage-title">${esc(q.passageTitle)}</div>`:""}${esc(q.passage)}</div>`;
   }
 }

 if(["mcq","truefalse","reading"].includes(t)){
   body+=(q.options||[]).map((o,j)=>`<label class="opt"><input type="radio" name="q_${q.id}" value="${j}"> ${esc(o)}</label>`).join("");
 }else if(["fill","short"].includes(t)){
   body+=`<input class="text-answer" id="ans_${q.id}" placeholder="اكتب إجابتك">`;
 }else if(t==="order"){
   let words=String(q.correctText||"").split(/\s+/).filter(Boolean).sort(()=>Math.random()-.5);
   body+=`<div class="info">${words.map(esc).join(" — ")}</div><input class="text-answer" id="ans_${q.id}" placeholder="اكتب الجملة بالترتيب الصحيح">`;
 }else if(t==="matching"){
   let rights=(q.pairs||[]).map((p,index)=>({index,...p})).sort(()=>Math.random()-.5);
   body+=(q.pairs||[]).map((p,j)=>`<div class="match-grid"><div class="match-side">${pairImage(p,"left")?`<img class="match-image zoomable-image" src="${esc(pairImage(p,"left"))}" alt="صورة الطرف الأول" onclick="openExamImageFromElement(this);event.stopPropagation()">`:""}<b>${esc(p.left)}</b></div><div><select class="match-answer" data-q="${q.id}" data-index="${j}"><option value="">اختر</option>${rights.map(r=>`<option value="${r.index}">${esc(r.right)}</option>`).join("")}</select><div class="match-choice-previews">${rights.map(r=>`<button type="button" class="match-preview" onclick="chooseMatchAnswer(this,'${q.id}',${j},${r.index})">${pairImage(r,"right")?`<img class="zoomable-image" src="${esc(pairImage(r,"right"))}" alt="صورة الطرف المقابل" onclick="openExamImageFromElement(this);event.stopPropagation()">`:""}<span>${esc(r.right)}</span></button>`).join("")}</div></div></div>`).join("");
 }
 return `<div class="q" dir="${d}"><b>${i+1}) ${esc(q.text)}</b>${body}</div>`;
}
function gradeQuestion(q){
 let t=q.type||"mcq",answer=null,correct=false;
 if(["mcq","truefalse","reading"].includes(t)){
   let r=document.querySelector(`input[name="q_${CSS.escape(q.id)}"]:checked`);answer=r?Number(r.value):null;correct=answer!==null&&answer===Number(q.correctIndex);
 }else if(["fill","short"].includes(t)){
   answer=document.getElementById("ans_"+q.id)?.value||"";let accepted=String(q.correctText||"").split("|").map(normalized);correct=accepted.includes(normalized(answer));
 }else if(t==="order"){
   answer=document.getElementById("ans_"+q.id)?.value||"";correct=normalized(answer)===normalized(q.correctText);
 }else if(t==="matching"){
   answer=[...document.querySelectorAll(`.match-answer[data-q="${CSS.escape(q.id)}"]`)].map(x=>x.value);
   correct=(q.pairs||[]).length>0&&(q.pairs||[]).every((p,i)=>Number(answer[i])===i);
 }
 return {answer,correct};
}
function answerText(q,a){
 let t=q.type||"mcq";
 if(["mcq","truefalse","reading"].includes(t))return a!==null&&a!==undefined?(q.options||[])[a]:"لم تجب";
 if(t==="matching")return Array.isArray(a)?a.join(" | "):"لم تجب";
 return a||"لم تجب";
}
function correctTextFor(q){
 let t=q.type||"mcq";
 if(["mcq","truefalse","reading"].includes(t))return (q.options||[])[Number(q.correctIndex)]||"";
 if(t==="matching")return (q.pairs||[]).map(p=>p.left+" ↔ "+p.right).join(" | ");
 return q.correctText||"";
}
async function startExam(id){
 let d=await db.collection("onlineExams").doc(id).get();ex={id:d.id,...d.data()};
 if(!targets(ex))return alert("الاختبار غير مخصص لهذا الطالب.");
 if(ex.active===false)return alert("الاختبار غير متاح حاليًا.");
 if(!publishStarted(ex))return alert("لم يحن موعد نشر هذا الاختبار بعد.");
 if(deadlineEnded(ex))return alert("انتهى موعد الاختبار.");
 let old=await db.collection("examAttempts").where("examId","==",id).where("studentCode","==",String(st.code)).get(),max=(ex.maxAttempts===undefined?1:Number(ex.maxAttempts));if(max!==0&&old.size>=max)return alert("اكتملت المحاولات المسموحة لهذا التدريب.");
 let s=await db.collection("onlineExams").doc(id).collection("questions").get();qs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));if(!qs.length)return alert("لا توجد أسئلة.");
 examName.textContent=ex.name;const seenPassages=new Set();questions.innerHTML=qs.map((q,i)=>renderStudentQuestion(q,i,seenPassages)).join("");
 left=Number(ex.durationMinutes||0)*60;view("take");tick();clearInterval(timerId);if(left>0)timerId=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timerId);submitExam(true)}},1000);
}
function tick(){timer.textContent=left?`⏱️ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:""}
async function submitExam(auto){
 if(!auto&&!confirm("تسليم الاختبار الآن؟"))return;clearInterval(timerId);
 let score=0,total=0,answers=[];qs.forEach(q=>{let g=gradeQuestion(q),p=Number(q.points||1);total+=p;if(g.correct)score+=p;answers.push({
   questionId:q.id,
   type:q.type||"mcq",
   answer:g.answer,
   correct:g.correct,
   points:p,
   awardedPoints:g.correct?p:0,
   questionText:String(q.text||""),
   textDirection:String(q.textDirection||"auto"),
   options:Array.isArray(q.options)?q.options.map(x=>String(x??"")):[],
   correctIndex:q.correctIndex===undefined?null:Number(q.correctIndex),
   correctText:String(q.correctText||""),
   pairs:Array.isArray(q.pairs)?q.pairs.map(x=>({left:String(x?.left||""),right:String(x?.right||"")})):[],
   passageTitle:String(q.passageTitle||""),
   passageGroupId:String(q.passageGroupId||"")
 })});
 let full=Number(ex.fullMark||total||1),mark=total?Number((score/total*full).toFixed(2)):0;
 let previous=await db.collection("examAttempts").where("examId","==",ex.id).where("studentCode","==",String(st.code)).get();

<script>
(function(){
  try{
    const raw=localStorage.getItem("rased.student.session.v1");
    if(!raw)return;
    const s=JSON.parse(raw);
    if(!s||!s.code||!s.expiresAt||Number(s.expiresAt)<=Date.now())return;
    const v=String(s.loginCode||s.code||"").trim();
    if(!v)return;
    const run=()=>{
      const el=document.getElementById("code");
      if(!el||typeof window["loginStudent"]!=="function")return false;
      el.value=v;
      el.dispatchEvent(new Event("input",{bubbles:true}));
      el.dispatchEvent(new Event("change",{bubbles:true}));
      Promise.resolve(window["loginStudent"]()).catch(console.error);
      return true;
    };
    if(!run()){
      let n=0;
      const t=setInterval(()=>{
        n++;
        if(run()||n>30)clearInterval(t);
      },150);
    }
  }catch(e){console.error("[Rased Student Auto Login]",e)}
})();
</script>
