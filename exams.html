<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة الاختبارات</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#1f2937}header{background:linear-gradient(135deg,#0c2745,#174f7c);color:white;text-align:center;padding:22px}.logo{width:80px;height:80px;object-fit:contain;background:#fff;border-radius:50%;padding:5px}header h1{margin:6px 0}header p{margin:0;color:#f4d77b;font-weight:bold}.wrap{max-width:950px;margin:20px auto;padding:12px}.card{background:#fff;border:1px solid #d7e0e8;border-radius:14px;margin-bottom:14px;overflow:hidden}.title{padding:13px;background:#eef4fa;color:#123c63;font-weight:bold}.body{padding:16px}input{width:100%;padding:11px;border:1px solid #bdc9d4;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:bold;background:#174f7c;color:#fff;cursor:pointer;margin-top:10px}.hidden{display:none}.info,.exam{padding:12px;border:1px solid #d7e0e8;border-radius:9px;margin-top:10px}.q{padding:14px;border:1px solid #d7e0e8;border-radius:9px;margin:10px 0}.opt{display:block;padding:8px;margin:5px 0;border:1px solid #e0e5ea;border-radius:7px}.opt input{width:auto}.text-answer{width:100%;padding:10px;border:1px solid #bdc9d4;border-radius:8px;margin-top:8px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:7px 0}.passage{padding:12px;background:#f8fafc;border:1px solid #d7e0e8;border-radius:8px;line-height:1.9;margin:10px 0}.question-image{display:block;max-width:100%;max-height:420px;object-fit:contain;margin:12px auto;border:1px solid #d7e0e8;border-radius:10px;background:#fff}.q[dir="ltr"]{text-align:left}.q[dir="rtl"]{text-align:right}.q[dir="ltr"] .opt{text-align:left}.q[dir="rtl"] .opt{text-align:right}.timer{text-align:center;color:#dc3545;font-size:20px;font-weight:bold}.deadline-open{color:#198754;font-weight:bold}.deadline-ended{color:#dc3545;font-weight:bold}.footer{text-align:center;color:#687786;font-size:11px;padding:15px}
</style></head><body>
<header><img src="logo.jpeg" class="logo" onerror="this.style.display='none'"><h1>منصة الاختبارات</h1><p>الاختبارات الإلكترونية</p></header>
<div class="wrap">
<div id="login" class="card"><div class="title">🎓 دخول الطالب</div><div class="body"><p>أدخل رقم هوية الطالب.</p><input id="code" placeholder="أدخل رقم هوية الطالب"><button onclick="loginStudent()">دخول</button></div></div>
<div id="list" class="card hidden"><div class="title">📝 الاختبارات المتاحة</div><div class="body"><div id="student"></div><div id="exams"></div><button onclick="logout()">خروج</button></div></div>
<div id="take" class="card hidden"><div class="title" id="examName">الاختبار</div><div class="body"><div id="timer" class="timer"></div><div id="questions"></div><button onclick="submitExam(false)">تسليم الاختبار</button></div></div>
<div id="result" class="card hidden"><div class="title">📊 النتيجة</div><div class="body" id="resultBody"></div></div>
<div class="footer">تصميم محمد عامر أحمد - نظام راصد 2026</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let st=null,ex=null,qs=[],left=0,timerId=null;
function view(x){["login","list","take","result"].forEach(i=>document.getElementById(i).classList.toggle("hidden",i!==x))}
function esc(x){return String(x??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function targets(e){return (e.classes||[]).some(c=>c.grade===st.grade&&c.section===st.section)}
function questionDir(q){
 let d=q?.textDirection||"auto";
 if(d==="rtl"||d==="ltr")return d;
 return /[\u0600-\u06FF]/.test(String(q?.text||""))?"rtl":"ltr";
}
async function loginStudent(){
 let c=code.value.trim();if(!c)return alert("أدخل رقم هوية الطالب.");
 let d=await db.collection("students").doc(c).get();
 if(d.exists)st={code:d.data().code||d.id,...d.data()};
 else{let q=await db.collection("students").where("code","==",c).limit(1).get();if(!q.empty){let x=q.docs[0];st={code:x.data().code||x.id,...x.data()}}}
 if(!st)return alert("رقم الهوية غير مسجل.");
 student.innerHTML=`<div class="info"><b>${esc(st.name)}</b><br>${esc(st.grade)} / ${esc(st.section)}</div>`;await loadExams();
}
function deadlineEnded(e){
 if(!e?.deadline)return false;
 const t=new Date(e.deadline).getTime();
 return Number.isFinite(t)&&Date.now()>t;
}
function deadlineText(e){
 if(!e?.deadline)return "بدون موعد نهائي";
 const d=new Date(e.deadline);
 if(Number.isNaN(d.getTime()))return "بدون موعد نهائي";
 return d.toLocaleString("ar-SA");
}
async function loadExams(){
 view("list");let s=await db.collection("onlineExams").get();let arr=s.docs.map(d=>({id:d.id,...d.data()})).filter(e=>e.active!==false&&targets(e));
 let a=await db.collection("examAttempts").where("studentCode","==",String(st.code)).get(),all=a.docs.map(d=>d.data());
 exams.innerHTML=arr.length?arr.map(e=>{
   let used=all.filter(x=>x.examId===e.id).length,max=(e.maxAttempts===undefined?1:Number(e.maxAttempts)),attemptAllowed=max===0||used<max,ended=deadlineEnded(e);
   let action=ended?'<div class="deadline-ended">🔴 انتهى موعد الاختبار</div>':(attemptAllowed?`<button onclick="startExam('${e.id}')">بدء التدريب</button>`:'<b>اكتملت المحاولات المسموحة</b>');
   let deadlineLine=e.deadline?`<br>آخر موعد: ${esc(deadlineText(e))}`:"";
   return `<div class="exam"><b>${esc(e.name)}</b><br>${esc(e.subjectName||"English")} — ${esc(e.durationMinutes||0)} دقيقة — ${esc(e.fullMark||0)} درجة${deadlineLine}<br>المحاولات: ${used}${max===0?" / غير محدود":" / "+max}<br>${action}</div>`
 }).join(""):"<div class='info'>لا توجد اختبارات متاحة حاليًا.</div>";
}

function normalized(v){return String(v??"").trim().toLowerCase().replace(/\s+/g," ")}
function renderStudentQuestion(q,i){
 let t=q.type||"mcq",d=questionDir(q),body="";
 if(q.imageUrl)body+=`<img class="question-image" src="${esc(q.imageUrl)}" alt="صورة السؤال">`;
 if(t==="reading"&&q.passage)body+=`<div class="passage">${esc(q.passage)}</div>`;
 if(["mcq","truefalse","reading"].includes(t)){
   body+=(q.options||[]).map((o,j)=>`<label class="opt"><input type="radio" name="q_${q.id}" value="${j}"> ${esc(o)}</label>`).join("");
 }else if(["fill","short"].includes(t)){
   body+=`<input class="text-answer" id="ans_${q.id}" placeholder="اكتب إجابتك">`;
 }else if(t==="order"){
   let words=String(q.correctText||"").split(/\s+/).filter(Boolean).sort(()=>Math.random()-.5);
   body+=`<div class="info">${words.map(esc).join(" — ")}</div><input class="text-answer" id="ans_${q.id}" placeholder="اكتب الجملة بالترتيب الصحيح">`;
 }else if(t==="matching"){
   let rights=(q.pairs||[]).map(p=>p.right).sort(()=>Math.random()-.5);
   body+=(q.pairs||[]).map((p,j)=>`<div class="match-grid"><b>${esc(p.left)}</b><select class="match-answer" data-q="${q.id}" data-index="${j}"><option value="">اختر</option>${rights.map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join("")}</select></div>`).join("");
 }
 return `<div class="q" dir="${d}"><b>${i+1}) ${esc(q.text)}</b>${body}</div>`;
}
function gradeQuestion(q){
 let t=q.type||"mcq",answer=null,correct=false;
 if(["mcq","truefalse","reading"].includes(t)){
   let r=document.querySelector(`input[name="q_${CSS.escape(q.id)}"]:checked`);answer=r?Number(r.value):null;correct=answer!==null&&answer===Number(q.correctIndex);
 }else if(["fill","short"].includes(t)){
   answer=document.getElementById("ans_"+q.id)?.value||"";let accepted=String(q.correctText||"").split("|").map(normalized);correct=accepted.includes(normalized(answer));
 }else if(t==="order"){
   answer=document.getElementById("ans_"+q.id)?.value||"";correct=normalized(answer)===normalized(q.correctText);
 }else if(t==="matching"){
   answer=[...document.querySelectorAll(`.match-answer[data-q="${CSS.escape(q.id)}"]`)].map(x=>x.value);
   correct=(q.pairs||[]).length>0&&(q.pairs||[]).every((p,i)=>normalized(answer[i])===normalized(p.right));
 }
 return {answer,correct};
}
function answerText(q,a){
 let t=q.type||"mcq";
 if(["mcq","truefalse","reading"].includes(t))return a!==null&&a!==undefined?(q.options||[])[a]:"لم تجب";
 if(t==="matching")return Array.isArray(a)?a.join(" | "):"لم تجب";
 return a||"لم تجب";
}
function correctTextFor(q){
 let t=q.type||"mcq";
 if(["mcq","truefalse","reading"].includes(t))return (q.options||[])[Number(q.correctIndex)]||"";
 if(t==="matching")return (q.pairs||[]).map(p=>p.left+" ↔ "+p.right).join(" | ");
 return q.correctText||"";
}
async function startExam(id){
 let d=await db.collection("onlineExams").doc(id).get();ex={id:d.id,...d.data()};if(!targets(ex))return alert("الاختبار غير مخصص لفصلك.");if(deadlineEnded(ex))return alert("انتهى موعد الاختبار.");
 let old=await db.collection("examAttempts").where("examId","==",id).where("studentCode","==",String(st.code)).get(),max=(ex.maxAttempts===undefined?1:Number(ex.maxAttempts));if(max!==0&&old.size>=max)return alert("اكتملت المحاولات المسموحة لهذا التدريب.");
 let s=await db.collection("onlineExams").doc(id).collection("questions").get();qs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));if(!qs.length)return alert("لا توجد أسئلة.");
 examName.textContent=ex.name;questions.innerHTML=qs.map((q,i)=>renderStudentQuestion(q,i)).join("");
 left=Number(ex.durationMinutes||0)*60;view("take");tick();clearInterval(timerId);if(left>0)timerId=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timerId);submitExam(true)}},1000);
}
function tick(){timer.textContent=left?`⏱️ ${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`:""}
async function submitExam(auto){
 if(!auto&&!confirm("تسليم الاختبار الآن؟"))return;clearInterval(timerId);
 let score=0,total=0,answers=[];qs.forEach(q=>{let g=gradeQuestion(q),p=Number(q.points||1);total+=p;if(g.correct)score+=p;answers.push({questionId:q.id,type:q.type||"mcq",answer:g.answer,correct:g.correct,points:p})});
 let full=Number(ex.fullMark||total||1),mark=total?Number((score/total*full).toFixed(2)):0;
 let previous=await db.collection("examAttempts").where("examId","==",ex.id).where("studentCode","==",String(st.code)).get();
 await db.collection("examAttempts").add({examId:ex.id,examName:ex.name||"",subjectId:ex.subjectId||"",subjectName:ex.subjectName||"English",teacherEmail:ex.teacherEmail||"",teacherName:ex.teacherName||"",studentCode:String(st.code),studentName:st.name||"",grade:st.grade||"",section:st.section||"",attemptNumber:previous.size+1,mark,fullMark:full,answers,submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
 let correction="";
 if(ex.showCorrections===true){
   correction=`<div style="margin-top:15px;text-align:right">${qs.map((q,i)=>{let a=answers.find(x=>x.questionId===q.id),chosen=answerText(q,a?.answer),right=correctTextFor(q);return `<div class="q" dir="${questionDir(q)}"><b>${i+1}) ${esc(q.text)}</b><br>إجابتك: ${esc(chosen)} ${a?.correct?"✅":"❌"}<br>الإجابة الصحيحة: <b>${esc(right)}</b></div>`}).join("")}</div>`;
 }
 resultBody.innerHTML=`<h2>تم تسليم التدريب بنجاح</h2><h1>${mark} / ${full}</h1>${correction}<button onclick="loadExams()">العودة للاختبارات</button>`;view("result");
}
function logout(){st=null;code.value="";view("login")}
</script></body></html>
