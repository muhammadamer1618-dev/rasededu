<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد - الحصص المباشرة للطلاب</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="rased-live-provider.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#f8f2e5,#fffdf7);color:#17372f}.head{background:linear-gradient(135deg,#004c3f,#006653);color:#fff;text-align:center;padding:17px}.head img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.head h1{margin:5px 0 2px}.wrap{max-width:1100px;margin:18px auto;padding:0 12px}.card{background:#fff;border:1px solid #e3dcc8;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 5px 18px #0001}.title{padding:13px 16px;background:#f6f0e3;color:#004c3f;font-size:17px;font-weight:bold}.body{padding:14px}.lookup{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:650px;margin:auto}.lookup input{height:46px;border:1px solid #d5c9ae;border-radius:10px;padding:10px;font-size:17px;text-align:center}.lookup button,button{border:0;border-radius:9px;padding:10px 14px;font-weight:bold;cursor:pointer}.primary{background:#006653;color:#fff}.gold{background:#c9972c;color:#fff}.light{background:#f0eee8;color:#30483f}.red{background:#b42318;color:#fff}.student-box{display:none;margin-top:12px;padding:10px;border-radius:10px;background:#eef8f5;border:1px solid #cae7dd}.student-box.show{display:block}.classes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.class-card{border:1px solid #dce7e2;border-radius:13px;padding:13px;background:#fff}.class-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.class-head h3{margin:0;color:#004c3f}.meta{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.badge{display:inline-block;padding:4px 7px;border-radius:20px;background:#eef5f2;color:#315a50;font-size:11px;font-weight:bold}.live{background:#fee2e2;color:#b42318}.done{background:#e8f8ee;color:#146b3a}.pending{background:#fff7e6;color:#8a5a00}.empty{text-align:center;padding:25px;color:#6a776f}.modal{display:none;position:fixed;inset:0;background:#001a2bcc;z-index:1000;align-items:center;justify-content:center;padding:10px}.modal.show{display:flex}.modal-box{width:min(1180px,98vw);height:min(760px,95vh);background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.modal-head{padding:10px 14px;background:#004c3f;color:#fff;display:flex;justify-content:space-between;align-items:center}.stage{flex:1;min-height:0;background:#07131c}.modal-foot{padding:8px;text-align:center;background:#f6f8f7}.notice{padding:10px;background:#fff7e6;color:#805600;border:1px solid #f1d69a;border-radius:9px;margin-bottom:12px}@media(max-width:700px){.classes{grid-template-columns:1fr}.lookup{grid-template-columns:1fr}.modal-box{height:97vh}}
</style></head><body>
<header class="head"><img src="logo.jpeg"><h1>💻 الحصص المباشرة</h1><div>بوابة الطالب وولي الأمر</div></header>
<div class="wrap"><div class="card"><div class="title">دخول الطالب</div><div class="body"><div class="notice">أدخل هوية/كود الطالب. سيعرض راصد فقط الحصص الخاصة بصفه وشعبته، ويُسجل الحضور تلقائيًا عند دخول القاعة داخل راصد.</div><div class="lookup"><input id="studentCode" placeholder="هوية أو كود الطالب"><button class="primary" onclick="lookupStudent()">عرض الحصص</button></div><div class="student-box" id="studentBox"></div></div></div>
<div class="card"><div class="title">الحصص المتاحة</div><div class="body"><div id="classesArea" class="empty">أدخل هوية الطالب لعرض الحصص.</div></div></div></div>
<div class="modal" id="roomModal"><div class="modal-box"><div class="modal-head"><b id="roomTitle">الحصة المباشرة</b><button class="light" onclick="leaveRoom()">خروج</button></div><div id="roomStage" class="stage"></div><div class="modal-foot"><span id="roomStatus">جاري تشغيل القاعة...</span></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const el=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
let student=null,classes=[],attendanceMap=new Map(),roomSession=null,currentClass=null,currentAttendanceRef=null,currentSessionRef=null,baseActive=0,sessionActive=0,tickTimer=null,lastTick=0,joined=false;
function norm(v){return String(v??"").trim().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").toLowerCase()}
function clean(v){return String(v||"").replace(/[^0-9A-Za-z_-]/g,"").trim()}
function fmtTs(v){try{const d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?"—":new Intl.DateTimeFormat("ar-SA",{dateStyle:"short",timeStyle:"short"}).format(d)}catch{return"—"}}
function dateTime(date,time){return new Date(`${date}T${time||"00:00"}:00`)}
function classState(c){if(c.status==="ended"||c.endedAt)return {k:"done",t:"انتهت",can:false};const now=Date.now(),s=dateTime(c.remoteDate,c.startTime).getTime(),e=dateTime(c.remoteDate,c.endTime).getTime();if(c.status==="live"||now>=s-10*60000&&now<=e+15*60000)return {k:"live",t:"🔴 مباشرة الآن",can:true};if(now<s-10*60000)return {k:"pending",t:"قادمة",can:false};return {k:"done",t:"انتهت",can:false}}
async function lookupStudent(){const code=clean(el("studentCode").value);if(!code){alert("أدخل هوية/كود الطالب.");return}let d=await db.collection("students").doc(code).get();if(!d.exists){const q=await db.collection("students").where("code","==",code).limit(1).get();if(!q.empty)d=q.docs[0]}if(!d.exists){alert("لم يتم العثور على الطالب.");return}student={code:d.data().code||d.id,...d.data()};el("studentBox").classList.add("show");el("studentBox").innerHTML=`<b>${esc(student.name||"")}</b> — ${esc(student.grade||"")} / ${esc(student.section||"")}`;await loadClasses()}
async function loadClasses(){const [cs,days,atts]=await Promise.all([db.collection("liveClasses").get(),db.collection("remoteLearningDays").get(),db.collection("liveClassAttendance").get()]);const activeDates=new Set(days.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.active===true).map(x=>x.date||x.id));classes=cs.docs.map(d=>({id:d.id,...d.data()})).filter(c=>c.published!==false&&activeDates.has(c.remoteDate)&&norm(c.grade)===norm(student.grade)&&norm(c.section)===norm(student.section)).sort((a,b)=>String(a.remoteDate).localeCompare(String(b.remoteDate))||Number(a.periodNumber)-Number(b.periodNumber));attendanceMap=new Map(atts.docs.map(d=>{const x=d.data()||{};return [x.classId+"|"+x.studentCode,x]}));renderClasses()}
function renderClasses(){if(!classes.length){el("classesArea").className="empty";el("classesArea").innerHTML="لا توجد حصص مباشرة مفعلة لهذا الطالب حاليًا.";return}el("classesArea").className="classes";el("classesArea").innerHTML=classes.map(c=>{const st=classState(c),a=attendanceMap.get(c.id+"|"+student.code)||{};const attended=a.present===true||Number(a.entryCount||0)>0;return`<div class="class-card"><div class="class-head"><h3>${esc(c.subjectName)} — الحصة ${esc(c.periodNumber)}</h3><span class="badge ${st.k}">${st.t}</span></div><div class="meta"><span class="badge">📅 ${esc(c.remoteDate)}</span><span class="badge">🕒 ${esc(c.startTime)} - ${esc(c.endTime)}</span><span class="badge">👨‍🏫 ${esc(c.teacherName||"")}</span>${attended?'<span class="badge done">✅ تم تسجيل حضورك</span>':''}</div><div style="font-weight:bold;margin:6px 0">${esc(c.title||"")}</div><div style="font-size:12px;color:#65756e;line-height:1.7">${esc(c.notes||"")}</div><div style="margin-top:10px"><button class="primary" ${st.can?"":"disabled"} onclick='joinClass(${JSON.stringify(c.id)})'>${st.can?"دخول الحصة داخل راصد":"غير متاحة الآن"}</button></div></div>`}).join("")}
function attendanceId(classId){return classId+"_"+String(student.code).replace(/[^0-9A-Za-z_-]/g,"_")}
async function joinClass(id){const c=classes.find(x=>x.id===id);if(!c)return;const st=classState(c);if(!st.can){alert("الحصة غير متاحة للدخول الآن.");return}currentClass=c;const aid=attendanceId(id);currentAttendanceRef=db.collection("liveClassAttendance").doc(aid);const old=await currentAttendanceRef.get();const oldData=old.exists?old.data()||{}:{};baseActive=Number(oldData.activeSeconds||0);sessionActive=0;joined=false;const sessionRef=db.collection("liveClassSessions").doc();currentSessionRef=sessionRef;await sessionRef.set({classId:id,studentCode:student.code,studentName:student.name||"",grade:student.grade||"",section:student.section||"",enteredAt:firebase.firestore.FieldValue.serverTimestamp(),closed:false});el("roomTitle").textContent=`${c.subjectName} — ${c.title}`;el("roomModal").classList.add("show");el("roomStage").innerHTML='<div style="color:#fff;padding:30px;text-align:center">جاري تشغيل القاعة داخل راصد...</div>';try{roomSession=await RasedLiveProvider.mount({db,container:el("roomStage"),roomKey:c.roomKey||RasedLiveProvider.roomKey("class",id),user:{id:student.code,name:student.name||student.code,email:""},role:"participant",context:{classId:id,studentCode:student.code},onJoined:()=>markJoined(),onLeft:()=>leaveRoom(true),onError:e=>console.error(e)});el("roomStatus").textContent="القاعة مفتوحة داخل راصد"}catch(e){console.error(e);el("roomStatus").textContent="❌ "+e.message;el("roomStage").innerHTML=`<div style="color:#fff;padding:30px;text-align:center">${esc(e.message)}</div>`}}
async function markJoined(){if(joined)return;joined=true;lastTick=Date.now();const snap=await currentAttendanceRef.get();const exists=snap.exists,prev=snap.data()||{};const scheduled=dateTime(currentClass.remoteDate,currentClass.startTime);const tardy=Math.max(0,Math.floor((Date.now()-scheduled.getTime())/60000));const data={classId:currentClass.id,studentCode:student.code,studentName:student.name||"",grade:student.grade||"",section:student.section||"",teacherEmail:currentClass.teacherEmail||"",teacherName:currentClass.teacherName||"",subjectName:currentClass.subjectName||"",present:true,entryCount:firebase.firestore.FieldValue.increment(1),lastActivityAt:firebase.firestore.FieldValue.serverTimestamp(),tardyMinutes:Math.min(999,tardy)};if(!exists||!prev.firstEntryAt)data.firstEntryAt=firebase.firestore.FieldValue.serverTimestamp();await currentAttendanceRef.set(data,{merge:true});el("roomStatus").textContent="✅ تم تسجيل حضورك";tickTimer=setInterval(tick,1000)}
async function tick(){if(!joined||document.hidden)return;const now=Date.now();const delta=Math.max(0,Math.min(2,(now-lastTick)/1000));lastTick=now;sessionActive+=delta;if(Math.floor(sessionActive)%10===0){await heartbeat()}}
async function heartbeat(){if(!currentAttendanceRef)return;await currentAttendanceRef.set({activeSeconds:Number((baseActive+sessionActive).toFixed(1)),lastActivityAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if(currentSessionRef)await currentSessionRef.set({activeSeconds:Number(sessionActive.toFixed(1)),lastSeenAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true})}
async function leaveRoom(fromProvider=false){if(tickTimer){clearInterval(tickTimer);tickTimer=null}if(joined){try{await heartbeat();await currentAttendanceRef.set({lastExitAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});if(currentSessionRef)await currentSessionRef.set({exitedAt:firebase.firestore.FieldValue.serverTimestamp(),closed:true,activeSeconds:Number(sessionActive.toFixed(1))},{merge:true})}catch(e){console.error(e)}}joined=false;if(roomSession&&!fromProvider){try{roomSession.dispose()}catch{}}roomSession=null;el("roomModal").classList.remove("show");el("roomStage").innerHTML="";currentClass=null;currentAttendanceRef=null;currentSessionRef=null;if(student)await loadClasses()}
document.addEventListener("visibilitychange",()=>{lastTick=Date.now()});window.addEventListener("beforeunload",()=>{if(joined)heartbeat()});
</script></body></html>
