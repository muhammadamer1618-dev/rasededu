<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="UTF-8">
<title>تغيير كلمة المرور</title>
<link href="https://fonts.googleapis.com/css2?family=Calibri:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: Calibri; background:#f4f4f4; margin:0; padding:20px }
.container {
  max-width:450px; margin:auto; background:white; padding:20px;
  border-radius:12px; box-shadow:0 0 10px rgba(0,0,0,0.2);
}
h1 { text-align:center; color:#1976d2; margin-bottom:15px }
label { font-weight:bold; display:block; margin-top:15px }
input {
  width:100%; padding:10px; font-size:16px; border-radius:8px;
  border:1px solid #999; margin-top:6px; box-sizing:border-box;
}
button {
  margin-top:20px; width:100%; padding:12px; border:none; border-radius:8px;
  background:#1976d2; color:white; font-size:18px; cursor:pointer;
  font-weight:bold;
}
button:hover { opacity:0.9 }
</style>

<style id="rased-mobile-friendly">
*{box-sizing:border-box;}
html{width:100%;overflow-x:hidden;}
body{width:100%;max-width:100%;overflow-x:hidden;}
img{max-width:100%;height:auto;}
button,input,select,textarea{max-width:100%;}
.table-wrap,.table-container,.table-responsive,.results-container,.results-content,.data-table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{max-width:100%;}
@media (max-width:768px){
  body{font-size:15px;}
  .container,.main-container,.page-container,.content,.content-container,.wrap,.wrapper,.card,.panel{max-width:100%;}
  header,.header,.topbar,.navbar,.nav{height:auto;min-height:0;}
  header,.header,.topbar,.navbar,.nav,.toolbar,.actions,.filters,.filter-row,.form-row,.button-row,.stats,.cards,.grid,.controls{flex-wrap:wrap;}
  header,.header,.topbar,.navbar,.nav{padding-left:12px!important;padding-right:12px!important;}
  .container,.main-container,.page-container,.content,.content-container,.wrap,.wrapper{width:100%!important;padding-left:12px!important;padding-right:12px!important;}
  .card,.panel,.box,.section{margin-left:0!important;margin-right:0!important;}
  .grid,.cards{grid-template-columns:1fr!important;}
  .filters,.filter-row,.form-row,.button-row,.toolbar,.actions{gap:8px!important;}
  .filters>* ,.filter-row>* ,.form-row>*{min-width:0!important;width:100%!important;max-width:100%!important;}
  input,select,textarea{width:100%;min-height:44px;font-size:16px;}
  button{min-height:44px;font-size:15px;}
  .button-row button,.actions button,.toolbar button{width:100%;}
  .table-wrap,.table-container,.table-responsive,.results-container,.results-content,.data-table-wrap{overflow-x:auto!important;}
  table{min-width:600px;}
  th,td{white-space:nowrap;}
  .modal,.dialog,.popup{max-width:calc(100vw - 24px)!important;width:auto!important;}
  .modal-content,.dialog-content{max-width:100%;}
  .logo{max-width:110px!important;height:auto!important;}
  h1{font-size:clamp(22px,6vw,32px)!important;}
  h2{font-size:clamp(19px,5vw,27px)!important;}
  h3{font-size:clamp(17px,4.5vw,23px)!important;}
  .parent-progress-box,.parent-subject-picker{max-width:100%;}
}
@media (max-width:420px){
  body{font-size:14px;}
  header,.header,.topbar,.navbar,.nav{padding:8px!important;}
  .container,.main-container,.page-container,.content,.content-container,.wrap,.wrapper{padding-left:8px!important;padding-right:8px!important;}
  table{min-width:560px;}
  th,td{padding:7px 6px!important;}
}
</style>
</head>

<body>

<div class="container">
  <h1>تغيير كلمة المرور</h1>

  <label>كلمة المرور الحالية</label>
  <input id="old_pass" type="password">

  <label>كلمة المرور الجديدة</label>
  <input id="new_pass" type="password">

  <button onclick="changePass()">حفظ التغيير</button>
</div>

<script>
/* Firebase Config */
var firebaseConfig = {
  apiKey: "AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",
  authDomain: "results2026-7c0dd.firebaseapp.com",
  projectId: "results2026-7c0dd",
  storageBucket: "results2026-7c0dd.firebasestorage.app",
  messagingSenderId: "241421115694",
  appId: "1:241421115694:web:96f55fd9fd1d5b18b31abf"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

async function changePass(){

  let email = localStorage.getItem("currentUserEmail");
  if(!email){
    alert("يرجى تسجيل الدخول من جديد");
    location = "index.html";
    return;
  }

  let oldP = document.getElementById("old_pass").value.trim();
  let newP = document.getElementById("new_pass").value.trim();

  if(!oldP || !newP){
    alert("أدخل كلمة المرور الحالية والجديدة");
    return;
  }

  let doc = await db.collection("users").doc(email).get();
  if(!doc.exists){
    alert("المستخدم غير موجود");
    return;
  }

  let data = doc.data();
  if(data.password !== oldP){
    alert("كلمة المرور الحالية غير صحيحة");
    return;
  }

  await db.collection("users").doc(email).set({ password:newP }, { merge:true });

  alert("تم تغيير كلمة المرور بنجاح");
  location = "index.html";
}
</script>

</body>
</html>
