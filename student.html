/* ===== جداول ولي الأمر ===== */
function parentNormalizeText(v){return String(v??"").trim().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ");}
function parentGradesMatch(a,b,stage){
 a=parentNormalizeText(a);b=parentNormalizeText(b);
 if(a===b)return true;
 const na=(a.match(/\d+/)||[])[0],nb=(b.match(/\d+/)||[])[0];
 if(!na||!nb||na!==nb)return false;
 const sa=a.includes("ابتد")?"primary":a.includes("متوسط")?"middle":a.includes("ثانوي")?"secondary":"";
 const sb=parentNormalizeText(stage||b).includes("ابتد")?"primary":parentNormalizeText(stage||b).includes("متوسط")?"middle":parentNormalizeText(stage||b).includes("ثانوي")?"secondary":"";
 return !sa||!sb||sa===sb;
}
function parentSectionsMatch(a,b){return parentNormalizeText(a)===parentNormalizeText(b);}
function parentDate(v){if(!v)return "-";const p=String(v).split("-");return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(v);}
async function loadParentWeeklyPlans(){
 const snap=await weeklyDb.collection("weeklyPlans").get();
 parentWeeklyPlans=[];
 snap.forEach(d=>{const x=d.data()||{};if(x.grade&&x.section&&Number(x.weekNumber)>=1&&Number(x.weekNumber)<=18)parentWeeklyPlans.push({id:d.id,...x});});
}
function parentHomework(row){
 if(row?.homework!=null&&String(row.homework).trim())return String(row.homework);
 const p=[];if(row?.book)p.push(row.book);if(row?.page)p.push("ص "+row.page);if(row?.exercise)p.push("تمرين "+row.exercise);if(row?.madrasati===true)p.push("منصة مدرستي");return p.join(" - ");
}
function parentPlanNorm(plan){
 const days={};["sunday","monday","tuesday","wednesday","thursday"].forEach(day=>{days[day]=[];const rows=Array.isArray(plan.days?.[day])?plan.days[day]:[];for(let i=0;i<8;i++){const r=rows[i]||{};days[day].push({subject:r.subject||"",topic:r.topic||"",homework:parentHomework(r)});}});
 return {...plan,days};
}
function renderParentPlanSelector(){
 const sel=document.getElementById("parentPlanWeek");if(!sel)return;
 const weeks=[...new Set(parentWeeklyPlans.map(x=>Number(x.weekNumber)).filter(Number.isFinite))].sort((a,b)=>a-b);
 sel.innerHTML='<option value="">اختر الأسبوع</option>'+weeks.map(w=>`<option value="${w}">الأسبوع ${w}</option>`).join("");
 if(weeks.length){const latest=Math.max(...weeks);sel.value=String(latest);renderParentWeeklyPlan(latest);}
}
function renderParentWeeklyPlan(week){
 const area=document.getElementById("parentPlanTable"),meta=document.getElementById("parentPlanMeta");if(!area)return;
 const plan=parentWeeklyPlans.find(x=>Number(x.weekNumber)===Number(week));
 if(!plan){area.innerHTML='<div class="parent-empty">لا توجد خطة أسبوعية متاحة.</div>';if(meta)meta.textContent="";return;}
 const p=parentPlanNorm(plan);
 if(meta)meta.textContent=`الأسبوع ${plan.weekNumber} — من ${parentDate(plan.startDate)} إلى ${parentDate(plan.endDate)}`;
 const days={sunday:"الأحد",monday:"الاثنين",tuesday:"الثلاثاء",wednesday:"الأربعاء",thursday:"الخميس"};
 let rows="";
 Object.keys(days).forEach(day=>p.days[day].forEach((r,i)=>{rows+=`<tr>${i===0?`<td rowspan="8" class="day-cell">${days[day]}</td>`:""}<td class="period-cell">${i+1}</td><td class="subject-cell">${escapeHtml(r.subject)||"-"}</td><td>${escapeHtml(r.topic)||"-"}</td><td>${escapeHtml(r.homework)||"-"}</td></tr>`;}));
 area.innerHTML=`<div class="parent-schedule-table-wrap"><table class="parent-schedule-table"><thead><tr><th>اليوم</th><th>الحصة</th><th>المادة</th><th>موضوع الدرس</th><th>الواجب</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function loadParentExamSchedules(){
 const area=document.getElementById("parentExamScheduleTable");if(!area||!currentStudent)return;
 const snap=await db.collection("examSchedules").get(),list=[];
 snap.forEach(d=>{const x=d.data()||{};if(x.visibleToParent===false)return;if(parentGradesMatch(currentStudent.grade,x.grade,x.stage)&&parentSectionsMatch(currentStudent.section,x.section))list.push({id:d.id,...x});});
 list.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.time||"").localeCompare(String(b.time||"")));
 if(!list.length){area.innerHTML='<div class="parent-empty">لا توجد اختبارات معلنة حاليًا لهذا الصف والشعبة.</div>';return;}
 const rows=list.map((x,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(x.subjectName||"-")}</td><td>${escapeHtml(x.name||"-")}</td><td>${escapeHtml(x.type||"-")}</td><td>${escapeHtml(x.date||"-")}</td><td>${escapeHtml(x.day||"-")}</td><td>${escapeHtml(x.time||"-")}</td><td>${escapeHtml(x.place||"-")}</td><td>${escapeHtml(x.notes||"-")}</td></tr>`).join("");
 area.innerHTML=`<div class="parent-schedule-table-wrap"><table class="parent-exam-table"><thead><tr><th>#</th><th>المادة</th><th>الاختبار</th><th>النوع</th><th>التاريخ</th><th>اليوم</th><th>الوقت</th><th>المكان</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function loadParentSchedules(){
 const area=document.getElementById("parentSchedulesArea");if(!area||!currentStudent)return;
 area.style.display="block";
 try{
  await loadParentWeeklyPlans();
  parentWeeklyPlans=parentWeeklyPlans.filter(x=>parentGradesMatch(currentStudent.grade,x.grade,x.stage)&&parentSectionsMatch(currentStudent.section,x.section));
  renderParentPlanSelector();
 }catch(e){console.error(e);document.getElementById("parentPlanTable").innerHTML='<div class="parent-empty">تعذر تحميل جدول الحصص حاليًا.</div>';}
 try{await loadParentExamSchedules();}catch(e){console.error(e);document.getElementById("parentExamScheduleTable").innerHTML='<div class="parent-empty">تعذر تحميل جدول الاختبارات حاليًا.</div>';}
}

/* =========================
   SEARCH
========================= */

.search-area{
    max-width:480px;
    margin:auto;
}

.field-label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:var(--navy-dark);
    margin:0 3px 7px;
}

.identity-box{
    position:relative;
}

.identity-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:10px;
    background:#e9f2f8;
    color:var(--navy);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    pointer-events:none;
}

#identityInput{
    width:100%;
    height:57px;
    border:1.5px solid #cad8e2;
    border-radius:14px;
    background:#fbfcfd;
    color:#172d3f;
    padding:0 59px 0 15px;
    font-family:Tahoma,Arial,sans-serif;
    font-size:17px;
    font-weight:bold;
    outline:none;
    transition:.2s;
    direction:ltr;
    text-align:center;
    letter-spacing:1px;
}

#identityInput::placeholder{
    color:#a0aab3;
    font-weight:normal;
    letter-spacing:0;
}

#identityInput:focus{
    background:#fff;
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(14,111,169,.09);
}

.search-btn{
    width:100%;
    height:53px;
    margin-top:12px;
    border:0;
    border-radius:14px;
    color:#fff;
    background:linear-gradient(
        135deg,
        var(--navy-dark),
        var(--navy),
        #116a9e
    );
    font-family:Tahoma,Arial,sans-serif;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(11,75,120,.18);
    transition:.2s;
}

.search-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(11,75,120,.23);
}

.search-btn:active{
    transform:scale(.99);
}

.search-btn:disabled{
    opacity:.7;
    cursor:not-allowed;
    transform:none;
}

.helper{
    text-align:center;
    font-size:10px;
    color:#8a99a6;
    margin-top:10px;
}

.message{
    display:none;
    margin-top:14px;
    border-radius:12px;
    padding:11px 13px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
}

.message.error{
    display:block;
    background:#fff0f1;
    color:#ad2631;
    border:1px solid #f1c4c8;
}

.message.success{
    display:block;
    background:#edf9f2;
    color:#247647;
    border:1px solid #bde5ce;
}

/* =========================
   RESULTS
========================= */

#resultsArea{
    display:none;
    width:min(1050px,100%);
}

.results-container{
    background:#fff;
    border:1px solid #dce5eb;
    border-radius:20px;
    box-shadow:0 18px 50px rgba(18,52,75,.10);
    overflow:hidden;
}

.results-head{
    padding:18px 22px;
    background:linear-gradient(
        135deg,
        var(--navy-dark),
        var(--navy)
    );
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.results-brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.result-logo{
    width:54px;
    height:54px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:2px;
}

.results-head h2{
    margin:0 0 3px;
    font-size:20px;
}

.results-head p{
    margin:0;
    font-size:10px;
    color:#d8e7f1;
}

.results-actions{
    display:flex;
    gap:7px;
}

.action-btn{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-family:Tahoma,Arial,sans-serif;
    font-weight:bold;
}

.new-search{
    background:#fff;
    color:var(--navy);
}

.print-btn{
    background:var(--gold);
    color:#fff;
}

/* =========================
   STUDENT DATA
========================= */

.student-info{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    border-bottom:1px solid #dce5eb;
}

.info-item{
    padding:13px 15px;
    border-left:1px solid #dce5eb;
}

.info-item:last-child{
    border-left:0;
}

.info-label{
    display:block;
    color:#80909d;
    font-size:9px;
    margin-bottom:4px;
}

.info-value{
    font-size:13px;
    font-weight:bold;
    color:var(--navy-dark);
}

/* =========================
   SUMMARY
========================= */

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:13px 18px 5px;
}

.summary-card{
    text-align:center;
    border-radius:10px;
    padding:9px 5px;
    border:1px solid #dde5eb;
}

.summary-card:nth-child(1){
    background:#eaf4fa;
}

.summary-card:nth-child(2){
    background:#edf8f1;
}

.summary-card:nth-child(3){
    background:#fff5d6;
}

.summary-card:nth-child(4){
    background:#fff0f1;
}

.summary-label{
    font-size:9px;
    font-weight:bold;
    color:#627382;
}

.summary-value{
    font-size:19px;
    font-weight:900;
    color:var(--navy);
    margin-top:2px;
}

/* =========================
   RESULTS TABLE
========================= */

.results-content{
    padding:13px 18px 20px;
}

.section-title{
    color:var(--navy-dark);
    font-size:14px;
    font-weight:bold;
    margin:0 0 9px;
    padding-bottom:7px;
    border-bottom:2px solid var(--gold);
}

.table-wrap{
    overflow-x:auto;
    border:1px solid #d5dfe6;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    background:#eaf1f6;
    color:var(--navy-dark);
    font-size:11px;
    padding:9px 6px;
    border-bottom:1px solid #cad6df;
}

td{
    padding:9px 6px;
    font-size:11px;
    text-align:center;
    border-bottom:1px solid #e2e8ed;
}

tbody tr:last-child td{
    border-bottom:0;
}

tbody tr:hover{
    background:#f7fafc;
}

.subject-name{
    font-weight:bold;
    color:var(--navy);
}

.present{
    color:#218654;
    font-weight:bold;
}

.absent{
    color:#c93e48;
    font-weight:bold;
}

.grade-good{
    color:#18814b;
    font-weight:bold;
}

.grade-low{
    color:#c43b45;
    font-weight:bold;
}

.no-results{
    text-align:center;
    padding:35px 15px;
    color:#7d8d9a;
}

/* =========================
   RESULTS FOOTER
========================= */

.results-footer{
    display:flex;
    justify-content:space-between;
    padding:9px 18px;
    border-top:1px solid #dce5eb;
    color:#788997;
    font-size:9px;
}

/* =========================
   PAGE FOOTER
========================= */

.page-footer{
    text-align:center;
    padding:0 15px 18px;
    color:#8796a3;
    font-size:10px;
}

.page-footer strong{
    color:var(--navy);
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

    .main{
        align-items:flex-start;
        padding-top:22px;
    }

    .portal{
        border-radius:19px;
    }

    .portal-body{
        padding:25px 20px 28px;
    }

    .logo-wrap{
        width:78px;
        height:78px;
    }

    .logo{
        width:68px;
        height:68px;
    }

    .portal-title{
        font-size:23px;
    }

    .student-info{
        grid-template-columns:1fr 1fr;
    }

    .info-item:first-child{
        grid-column:1/-1;
    }

    .summary{
        grid-template-columns:repeat(2,1fr);
    }

    .results-head{
        flex-direction:column;
        text-align:center;
    }

    .results-brand{
        flex-direction:column;
    }
}

/* =========================
   PRINT
========================= */

@media print{

    @page{
        size:A4 portrait;
        margin:8mm;
    }

    *{
        -webkit-print-color-adjust:exact !important;
        print-color-adjust:exact !important;
    }

    body{
        background:#fff !important;
    }

    .top-line,
    #searchPortal,
    .page-footer,
    .results-actions{
        display:none !important;
    }

    .main{
        display:block;
        padding:0;
    }

    #resultsArea{
        display:block !important;
        width:100%;
    }

    .results-container{
        box-shadow:none;
        border:1px solid #aaa;
        border-radius:0;
    }

    .results-head{
        padding:9px 12px;
        background:#0b4b78 !important;
    }

    .result-logo{
        width:45px;
        height:45px;
    }

    .results-head h2{
        font-size:15px;
    }

    .student-info{
        grid-template-columns:2fr 1fr 1fr;
    }

    .info-item{
        padding:7px 9px;
    }

    .summary{
        padding:7px 10px 3px;
        gap:4px;
    }

    .summary-card{
        padding:5px;
    }

    .summary-value{
        font-size:14px;
    }

    .results-content{
        padding:8px 10px 10px;
    }

    table{
        min-width:0;
    }

    th,
    td{
        padding:5px 3px;
        font-size:8px;
    }

    th{
        background:#eaf1f6 !important;
    }

    .results-footer{
        padding:6px 10px;
        font-size:7px;
    }
}


/* ===== تطور مستوى الطالب ===== */
.progress-panel{background:#fff;border:1px solid #dbe5ef;border-radius:12px;padding:14px;margin-top:12px}
.progress-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.progress-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.progress-stat{background:#f6f9fc;border:1px solid #e1e8ef;border-radius:10px;padding:12px;text-align:center}
.progress-stat b{display:block;font-size:20px;color:#174f7c;margin-top:4px}
.progress-chart{width:100%;height:280px;border:1px solid #e1e8ef;border-radius:12px;background:#fff;overflow:hidden}
.progress-chart svg{width:100%;height:100%;display:block}
.progress-trend{font-weight:bold;font-size:15px;text-align:center;padding:10px;border-radius:9px;background:#eef4fa;color:#174f7c;margin:10px 0}
.progress-table{width:100%;border-collapse:collapse;min-width:620px}
.progress-table th,.progress-table td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:center}
.progress-table th{background:#174f7c;color:#fff}
@media(max-width:700px){.progress-stats{grid-template-columns:repeat(2,1fr)}.progress-chart{height:230px}}

.parent-progress-box{margin-top:18px;background:#fff;border:1px solid #d8e2e9;border-radius:16px;padding:16px}
.parent-progress-box select{width:100%;height:46px;border:1px solid #cbd5e1;border-radius:9px;padding:8px;font-family:Tahoma,Arial,sans-serif;background:#fff}


/* إصلاح قائمة اختيار المادة في تحليل تطور المستوى */
#parentProgressSubject{display:none!important}
.parent-subject-picker{position:relative;width:100%;z-index:100}
.parent-subject-btn{
 width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:9px;
 padding:10px 14px;background:#fff;color:#1f2937;font-family:Tahoma,Arial,sans-serif;
 font-size:14px;text-align:right;display:flex;align-items:center;justify-content:space-between;cursor:pointer
}
.parent-subject-btn::after{content:"▼";font-size:10px;color:#174f7c}
.parent-subject-menu{
 display:none;position:absolute;top:calc(100% + 5px);right:0;left:0;width:100%;
 max-height:260px;overflow-y:auto;background:#fff;border:1px solid #cbd5e1;
 border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:99999

 display:block;width:100%;border:0;border-bottom:1px solid #edf0f3;

function rasedProgressSort(items){
 return items.slice().sort((a,b)=>{
  const da=String(a.testDate||a.date||""),dbb=String(b.testDate||b.date||"");
  if(da!==dbb)return da.localeCompare(dbb);
  return String(a.testName||"").localeCompare(String(b.testName||""),"ar");
 });
}
function rasedProgressPercent(r){
 const m=Number(r.mark),f=Number(r.fullMark);
 return r.attendance==="present" && r.mark!==null && r.mark!==undefined && r.mark!=="" && !Number.isNaN(m) && !Number.isNaN(f) && f>0 ? (m/f)*100 : null;
}
function rasedProgressTrend(values){
 if(values.length<2)return "➡️ بيانات غير كافية لتحديد الاتجاه";
 const n=values.length, xm=(n-1)/2, ym=values.reduce((a,b)=>a+b,0)/n;
 let num=0,den=0;
 values.forEach((y,i)=>{num+=(i-xm)*(y-ym);den+=(i-xm)*(i-xm)});
 const slope=den?num/den:0;
 if(slope>1)return "📈 المستوى في اتجاه تصاعدي";
 if(slope<-1)return "📉 المستوى في اتجاه تنازلي";
 return "➡️ المستوى مستقر تقريبًا";
}
function rasedProgressSvg(items){
 const pts=items.map((r,i)=>({label:r.testName||("اختبار "+(i+1)),v:rasedProgressPercent(r)})).filter(x=>x.v!==null);
 if(!pts.length)return '<div style="padding:90px 15px;text-align:center;color:#6b7280">لا توجد درجات مرصودة لرسم التطور.</div>';
 const W=900,H=270,L=55,R=25,T=20,B=48,iw=W-L-R,ih=H-T-B;
 const x=i=>pts.length===1?L+iw/2:L+(i/(pts.length-1))*iw;
 const y=v=>T+ih-(Math.max(0,Math.min(100,v))/100)*ih;
 let grid="";
 [0,25,50,75,100].forEach(v=>{grid+=`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#64748b">${v}%</text>`});
 const poly=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
 const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="5" fill="#174f7c"/><text x="${x(i)}" y="${y(p.v)-10}" text-anchor="middle" font-size="11" font-weight="bold" fill="#174f7c">${p.v.toFixed(0)}%</text><text x="${x(i)}" y="${H-17}" text-anchor="middle" font-size="10" fill="#475569">${String(p.label).slice(0,15)}</text>`).join("");
 return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#94a3b8"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#94a3b8"/>${pts.length>1?`<polyline points="${poly}" fill="none" stroke="#174f7c" stroke-width="3"/>`:""}${dots}</svg>`;
}
function rasedProgressHtml(items,escFn){
 const sorted=rasedProgressSort(items), vals=sorted.map(rasedProgressPercent).filter(v=>v!==null);
 const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null;
 const high=vals.length?Math.max(...vals):null, low=vals.length?Math.min(...vals):null;
 const rows=sorted.map((r,i)=>{
  const p=rasedProgressPercent(r),abs=r.attendance==="absent";
  return `<tr><td>${i+1}</td><td>${escFn(r.testName||"-")}</td><td>${escFn(r.testDate||"-")}</td><td>${abs?"غائب":(r.mark===null||r.mark===undefined||r.mark===""?"غير مرصود":escFn(r.mark+" / "+r.fullMark))}</td><td>${p===null?"—":p.toFixed(1)+"%"}</td></tr>`;
 }).join("");
 return `<div class="progress-stats"><div class="progress-stat">الاختبارات<b>${sorted.length}</b></div><div class="progress-stat">المتوسط<b>${avg===null?"—":avg.toFixed(1)+"%"}</b></div><div class="progress-stat">أعلى نتيجة<b>${high===null?"—":high.toFixed(1)+"%"}</b></div><div class="progress-stat">أقل نتيجة<b>${low===null?"—":low.toFixed(1)+"%"}</b></div></div><div class="progress-trend">${rasedProgressTrend(vals)}</div><div class="progress-chart">${rasedProgressSvg(sorted)}</div><div style="overflow:auto;margin-top:12px"><table class="progress-table"><thead><tr><th>#</th><th>الاختبار</th><th>التاريخ</th><th>الدرجة</th><th>النسبة</th></tr></thead><tbody>${rows||'<tr><td colspan="5">لا توجد نتائج.</td></tr>'}</tbody></table></div>`;
}

function parentProgressSection(){
 const map=new Map();currentResults.forEach(r=>{if(r.subjectId&&!map.has(r.subjectId))map.set(r.subjectId,r.subjectName||"المادة")});
 if(!map.size)return "";

<div id="parentSubjectPicker" class="parent-subject-picker">
<button type="button" class="parent-subject-btn" onclick="toggleParentSubjectPicker(event)"><span id="parentSubjectPickerText">-- اختر المادة --</span></button>

</div>
<div id="parentProgressResult"></div></div>`;
}
function toggleParentSubjectPicker(event){
 event.stopPropagation();
 const p=el("parentSubjectPicker");
 if(p)p.classList.toggle("open");

function chooseParentSubject(id,name,event){
 event.stopPropagation();
 const s=el("parentProgressSubject"),p=el("parentSubjectPicker"),t=el("parentSubjectPickerText");
 if(s)s.value=id;
 if(t)t.textContent=name;

}
document.addEventListener("click",()=>{
 const p=el("parentSubjectPicker");

function renderParentProgress(){
 const sid=el("parentProgressSubject")?.value||"",out=el("parentProgressResult");if(!out)return;
 if(!sid){out.innerHTML="";return}

}

function el(id){

function escapeHtml(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function cleanIdentity(value){

    return String(value||"")
        .replace(/[^\d]/g,"")
        .trim();
}


function formatMark(value){

    if(
        value===null ||
        value===undefined ||
        value===""
    ){
        return "—";
    }

    const n=Number(value);

    if(Number.isNaN(n)){
        return "—";
    }

    return Number.isInteger(n)
        ? String(n)
        : n.toFixed(2);
}

/* =========================
   SEARCH

async function searchStudent(){

    hideMessage();

    const identity=
        cleanIdentity(
            el("identityInput").value
        );


    if(!identity){

        showMessage(
            "فضلاً أدخل رقم الهوية."
        );

        el("identityInput").focus();

        return;
    }


    const btn=el("searchBtn");

    btn.disabled=true;
    btn.textContent="جاري البحث...";


    try{

        /*
          رقم الهوية هو نفسه document ID
          المستخدم حاليًا في students/{code}
        */

        let studentDoc=
            await db
                .collection("students")
                .doc(identity)
                .get();


        /*
          احتياط في حالة كان رقم الهوية
          مخزن داخل حقل code وليس Document ID
        */

        if(!studentDoc.exists){

            const studentQuery=
                await db
                    .collection("students")
                    .where("code","==",identity)
                    .limit(1)
                    .get();


            if(!studentQuery.empty){

                studentDoc=
                    studentQuery.docs[0];
            }
        }


        if(!studentDoc.exists){

            showMessage(
                "لم يتم العثور على طالب بهذا الرقم."
            );

            return;
        }


        const data=
            studentDoc.data()||{};


        currentStudent={
            ...data,
            code:
                data.code ||
                studentDoc.id
        };


        await loadStudentResults(
            currentStudent.code
        );


        renderResults();
        await loadParentSchedules();

    }

    catch(error){

        console.error(error);

        showMessage(
            "تعذر تحميل النتائج حاليًا. حاول مرة أخرى."
        );

    }

    finally{

        btn.disabled=false;
        btn.textContent="عرض النتائج";
    }
}


/* =========================
   LOAD RESULTS
========================= */

async function loadStudentResults(studentCode){

    currentResults=[];


    const gradesSnap=
        await db
            .collection("grades")
            .where(
                "studentCode",
                "==",
                String(studentCode)
            )
            .get();


    const allResults=[];


    gradesSnap.forEach(doc=>{

        allResults.push({
            id:doc.id,
            ...doc.data()
        });

    });


    /*
      ولي الأمر لا يرى أي نتيجة لمجرد أنها محفوظة.
      يجب أن يكون الاختبار نفسه مفعلاً من الإدارة:
      visibleToParent === true
    */

    const testIds=[
        ...new Set(
            allResults
                .map(result=>
                    String(result.testId||"")
                )
                .filter(Boolean)
        )
    ];


    if(!testIds.length){

        currentResults=[];
        return;
    }


    const testDocs=
        await Promise.all(
            testIds.map(testId=>
                db
                    .collection("tests")
                    .doc(testId)
                    .get()
            )
        );


    const visibleTestIds=
        new Set(
            testDocs
                .filter(testDoc=>
                    testDoc.exists &&
                    testDoc.data() &&
                    testDoc.data().visibleToParent===true
                )
                .map(testDoc=>testDoc.id)
        );


    /*
      الاختبار المخفي يظل محفوظاً في tests،
      ودرجاته تظل محفوظة في grades،
      لكنه لا يدخل إطلاقاً في بيانات ولي الأمر
      أو الملخص أو الطباعة.
    */

    currentResults=
        allResults.filter(result=>
            visibleTestIds.has(
                String(result.testId||"")
            )
        );


    /*
      الأحدث أولاً
    */

    currentResults.sort((a,b)=>{

        const dateA=
            String(
                a.testDate||""
            );

        const dateB=
            String(
                b.testDate||""
            );

        return dateB.localeCompare(dateA);

    });
}

        `;
    }


    let rows="";


    currentResults.forEach(
        (result,index)=>{

            const isAbsent=
                result.attendance==="absent";


            const mark=
                isAbsent
                ?
                "—"
                :
                formatMark(
                    result.mark
                );


            const fullMark=
                formatMark(
                    result.fullMark
                );


            let percentage="—";
            let gradeClass="";


            if(
                !isAbsent &&
                result.mark!==null &&
                result.mark!==undefined &&
                Number(result.fullMark)>0
            ){

                const p=
                    (
                        Number(result.mark) /
                        Number(result.fullMark)
                    )*100;


                percentage=
                    p.toFixed(1)+"%";


                gradeClass=
                    p>=50
                    ?
                    "grade-good"
                    :
                    "grade-low";
            }


            rows+=`

                <tr>

                    <td>
                        ${index+1}
                    </td>

                    <td class="subject-name">

                        ${escapeHtml(
                            result.subjectName||"-"
                        )}

                    </td>

                    <td>

                        ${escapeHtml(
                            result.testName||"-"
                        )}

                    </td>

                    <td>

                        ${escapeHtml(
                            result.testDate||"-"
                        )}

                    </td>

                    <td class="${
                        isAbsent
                        ?
                        "absent"
                        :
                        "present"
                    }">

                        ${
                            isAbsent
                            ?
                            "غائب"
                            :
                            "حاضر"
                        }

                    </td>

                    <td class="${gradeClass}">

                        ${
                            isAbsent
                            ?
                            "—"
                            :
                            mark+" / "+fullMark
                        }

                    </td>

                    <td class="${gradeClass}">
                        ${percentage}
                    </td>

                </tr>

            `;
        }
    );


    return`

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>المادة</th>

                        <th>الاختبار</th>

                        <th>التاريخ</th>

                        <th>الحضور</th>

                        <th>الدرجة</th>

                        <th>النسبة</th>

                    </tr>

                </thead>

                <tbody>
                    ${rows}
                </tbody>

            </table>

        </div>

    `;
}

    el("resultsArea").innerHTML="";

    const scheduleArea=el("parentSchedulesArea");
