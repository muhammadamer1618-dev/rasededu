<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدول الاختبارات | مدارس الفلاح</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
:root{--navy:#0b4b78;--navy2:#073653;--blue:#0e6fa9;--gold:#d7aa2d;--bg:#f2f6f9;--text:#17344b;--muted:#748596;--border:#dbe4eb}
body{margin:0;font-family:Tahoma,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(215,170,45,.10),transparent 24%),radial-gradient(circle at 90% 90%,rgba(14,111,169,.10),transparent 28%),linear-gradient(135deg,#f8fafc,#edf3f7)}
.top-line{height:6px;background:linear-gradient(90deg,var(--navy2),var(--navy),var(--gold),var(--navy))}
.page{width:min(1120px,calc(100% - 24px));margin:24px auto 35px}
.card{background:#fff;border:1px solid rgba(11,75,120,.12);border-radius:22px;box-shadow:0 18px 50px rgba(18,52,75,.10);overflow:hidden}
.header{padding:18px 22px;background:linear-gradient(135deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}.title{margin:0;font-size:21px}.sub{margin:3px 0 0;font-size:11px;color:#dbeaf4}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 13px;font-family:inherit;font-weight:bold;cursor:pointer}.btn.gold{background:var(--gold);color:#fff}.btn.light{background:#fff;color:var(--navy)}
.search{padding:24px}.field{max-width:520px;margin:auto}.label{display:block;font-size:13px;font-weight:bold;margin:0 3px 7px}.input{width:100%;height:54px;border:1.5px solid #cad8e2;border-radius:13px;background:#fbfcfd;font:700 17px Tahoma;text-align:center;direction:ltr;outline:none}.input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(14,111,169,.09)}.searchbtn{width:100%;margin-top:10px;height:50px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--navy2),var(--navy),#116a9e);color:#fff;font:bold 15px Tahoma;cursor:pointer}.searchbtn:disabled{opacity:.65;cursor:not-allowed}.message{display:none;margin-top:11px;padding:11px;border-radius:11px;text-align:center;font-size:12px;font-weight:bold}.message.show{display:block}.error{background:#fff0f1;color:#ad2631;border:1px solid #f1c4c8}
.studentbar{display:none;padding:13px 20px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);grid-template-columns:2fr 1fr 1fr}.studentbar.show{display:grid}.info{padding:4px 14px;border-left:1px solid var(--border)}.info:last-child{border-left:0}.lab{display:block;font-size:9px;color:#80909d;margin-bottom:4px}.val{font-size:13px;font-weight:bold}
.content{display:none;padding:20px}.content.show{display:block}.notice{background:#f7fafc;border:1px solid #dce6ec;border-radius:12px;padding:12px 14px;margin-bottom:14px;color:#617384;font-size:12px;line-height:1.8}.table-wrap{overflow-x:auto;border:1px solid #d5dfe6;border-radius:12px}.schedule{width:100%;min-width:900px;border-collapse:collapse}.schedule th{background:#eaf1f6;color:var(--navy2);font-size:11px;padding:10px 7px;border-bottom:1px solid #cad6df}.schedule td{padding:10px 7px;font-size:11px;text-align:center;border-bottom:1px solid #e2e8ed}.schedule tr:last-child td{border-bottom:0}.subject{font-weight:bold;color:var(--navy)}.empty{text-align:center;padding:45px 15px;color:#7d8d9a;font-size:13px}.footer{text-align:center;color:#8a99a6;font-size:10px;padding:14px}
@media(max-width:650px){.page{width:min(100% - 12px,1120px);margin:12px auto}.header{padding:15px}.logo{width:48px;height:48px}.title{font-size:17px}.studentbar{grid-template-columns:1fr;gap:6px}.info{border-left:0;border-bottom:1px solid var(--border);padding:7px}.info:last-child{border-bottom:0}.search,.content{padding:15px}}
@media print{body{background:#fff}.top-line,.search,.actions,.footer{display:none!important}.page{width:100%;margin:0}.card{box-shadow:none;border:0}.header{border-radius:0}.content,.studentbar{display:block!important}.studentbar{display:grid!important}}
</style>
</head>
<body>
<div class="top-line"></div>
<main class="page">
<section class="card">
<header class="header">
<div class="brand">
<img src="logo.jpeg" class="logo" alt="شعار مدارس الفلاح">
<div><h1 class="title">📝 جدول الاختبارات</h1><p class="sub">مدارس الفلاح الأهلية • بوابة الطالب</p></div>
</div>
<div class="actions">
<button class="btn light" type="button" onclick="newSearch()">بحث جديد</button>
<button class="btn gold" type="button" onclick="window.print()">طباعة</button>
</div>
</header>

<section class="search" id="searchArea">
<div class="field">
<label class="label" for="identityInput">رقم هوية الطالب</label>
<input id="identityInput" class="input" inputmode="numeric" autocomplete="off" maxlength="20" placeholder="أدخل رقم الهوية">
<button id="searchBtn" class="searchbtn" type="button" onclick="searchStudent()">عرض جدول الاختبارات</button>
<div id="message" class="message"></div>
</div>
</section>

<section id="studentBar" class="studentbar">
<div class="info"><span class="lab">اسم الطالب</span><span class="val" id="studentName">—</span></div>
<div class="info"><span class="lab">الصف</span><span class="val" id="studentGrade">—</span></div>
<div class="info"><span class="lab">الشعبة</span><span class="val" id="studentSection">—</span></div>
</section>

<section id="content" class="content">
<div class="notice">هذا الجدول مخصص لمواعيد الاختبارات المعلنة من المدرسة، وهو مستقل عن نتائج ودرجات الطالب في نظام راصد.</div>
<div id="examArea" class="table-wrap"><div class="empty">لا توجد اختبارات معلنة حاليًا.</div></div>
</section>
<div class="footer">نظام راصد • مدارس الفلاح الأهلية • تصميم محمد عامر أحمد 2026</div>
</section>
</main>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:421421115694:web:96f55fd9fd1d5b18b31abf"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
let currentStudent=null;

function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function clean(v){return String(v||"").replace(/[^\d]/g,"").trim()}
function norm(v){return String(v??"").trim().replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[()\-_/]/g," ").replace(/\s+/g," ").toLowerCase()}
function normSection(v){return norm(v).replace(/^الشعبه\s*/,"").replace(/^فصل\s*/,"").trim()}
function gradeNum(v){const t=norm(v),d=t.match(/\d+/);if(d)return Number(d[0]);const m=[["الاول",1],["الاولى",1],["الثاني",2],["الثانيه",2],["الثالث",3],["الثالثه",3],["الرابع",4],["الرابعه",4],["الخامس",5],["الخامسه",5],["السادس",6],["السادسه",6]];for(const [w,n] of m)if(t.includes(w))return n;return null}
function stage(v){const t=norm(v);if(t.includes("ابتد"))return"primary";if(t.includes("متوسط"))return"middle";if(t.includes("ثانوي"))return"secondary";return""}
function gradesMatch(s,g,ps){if(norm(s)===norm(g))return true;const a=gradeNum(s),b=gradeNum(g);if(a===null||b===null||a!==b)return false;const as=stage(s),bs=stage(ps||g);return !as||!bs||as===bs}
function sectionsMatch(a,b){return normSection(a)===normSection(b)}
async function searchStudent(){
 hide();const id=clean(document.getElementById("identityInput").value);if(!id){show("فضلاً أدخل رقم الهوية.");return}
 const b=document.getElementById("searchBtn");b.disabled=true;b.textContent="جاري البحث...";
 try{
  let doc=await db.collection("students").doc(id).get();
  if(!doc.exists){const q=await db.collection("students").where("code","==",id).limit(1).get();if(!q.empty)doc=q.docs[0]}
  if(!doc.exists){show("لم يتم العثور على طالب بهذا الرقم.");return}
  currentStudent={...(doc.data()||{}),code:(doc.data()||{}).code||doc.id};
  document.getElementById("studentName").textContent=currentStudent.name||"—";
  document.getElementById("studentGrade").textContent=currentStudent.grade||"—";
  document.getElementById("studentSection").textContent=currentStudent.section||"—";
  await loadExams();
  document.getElementById("studentBar").classList.add("show");document.getElementById("content").classList.add("show");document.getElementById("searchArea").style.display="none";
 }catch(e){console.error(e);show("تعذر تحميل جدول الاختبارات حاليًا.");}
 finally{b.disabled=false;b.textContent="عرض جدول الاختبارات"}
}
async function loadExams(){
 const snap=await db.collection("examSchedules").get(),list=[];
 snap.forEach(d=>{const x=d.data()||{};if(x.visibleToParent===false)return;if(gradesMatch(currentStudent.grade,x.grade,x.stage)&&sectionsMatch(currentStudent.section,x.section))list.push({id:d.id,...x})});
 list.sort((a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.time||"").localeCompare(String(b.time||"")));
 const area=document.getElementById("examArea");
 if(!list.length){area.innerHTML='<div class="empty">لا توجد اختبارات معلنة حاليًا لهذا الصف والشعبة.</div>';return}
 const rows=list.map((x,i)=>`<tr><td>${i+1}</td><td class="subject">${esc(x.subjectName||"-")}</td><td>${esc(x.name||"-")}</td><td>${esc(x.type||"-")}</td><td>${esc(x.date||"-")}</td><td>${esc(x.day||"-")}</td><td>${esc(x.time||"-")}</td><td>${esc(x.place||"-")}</td><td>${esc(x.notes||"-")}</td></tr>`).join("");
 area.innerHTML=`<table class="schedule"><thead><tr><th>#</th><th>المادة</th><th>الاختبار</th><th>النوع</th><th>التاريخ</th><th>اليوم</th><th>الوقت</th><th>المكان</th><th>ملاحظات</th></tr></thead><tbody>${rows}</tbody></table>`
}
function show(t){const m=document.getElementById("message");m.textContent=t;m.className="message show error"}
function hide(){const m=document.getElementById("message");m.textContent="";m.className="message"}
function newSearch(){location.reload()}
document.getElementById("identityInput").addEventListener("keydown",e=>{if(e.key==="Enter")searchStudent()});
</script>
</body>
</html>
