function protect(){currentRole=(localStorage.getItem('currentUserRole')||'').toLowerCase();if(!['admin','superadmin','supervisor'].includes(currentRole)){alert('هذه الصفحة للمشرف العام والإدارة فقط');location.href='index.html';return false}return true}function hasPerm(key){return currentRole==='admin'||currentRole==='superadmin'||currentPermissions[key]===true}async function loadSupervisorPermissions(){if(currentRole==='admin'||currentRole==='superadmin'){currentSupervisorType='general_supervisor';assignedTeacherEmails=[];currentPermissions={activitiesView:true,activitiesReview:true,activitiesPublish:true,activitiesReturn:true,activitiesDelete:true};return}currentUsername=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();if(!currentUsername){throw new Error('لم يتم العثور على اسم مستخدم المشرف.')}const doc=await db.collection('users').doc(currentUsername).get();if(!doc.exists||String(doc.data()?.role||'').toLowerCase()!=='supervisor'){throw new Error('حساب المشرف غير موجود أو لا يحمل دور supervisor.')}const x=doc.data()||{};currentSupervisorType=String(x.supervisorType||'general_supervisor').toLowerCase();assignedTeacherEmails=Array.isArray(x.assignedTeacherEmails)?x.assignedTeacherEmails.map(v=>String(v||'').trim().toLowerCase()).filter(Boolean):[];const p=x.permissions||{};currentPermissions={activitiesView:p.activitiesView!==false,activitiesReview:p.activitiesReview!==false,activitiesPublish:p.activitiesPublish!==false,activitiesReturn:p.activitiesReturn!==false,activitiesDelete:p.activitiesDelete!==false};if(!currentPermissions.activitiesView){alert('ليس لديك صلاحية عرض تقارير الأنشطة.');location.href='index.html';throw new Error('NO_ACTIVITY_VIEW_PERMISSION')}}function label(s){return {submitted:'مرسل للمشرف',reviewed:'تمت المراجعة',revision_requested:'معاد للتعديل',published:'منشور لولي الأمر',draft:'مسودة'}[s]||s}function isSelfActivityLeader(a){

async function load(){
  const s=await db.collection('activities').get();
  data=s.docs
    .map(d=>({id:d.id,...d.data()}));
  if(currentSupervisorType==="supervisor"){
    const allowed=new Set(assignedTeacherEmails);
    data=data.filter(a=>{
      const email=String(a.teacherEmail||a.executorEmail||"").trim().toLowerCase();
      return email&&allowed.has(email);

  }
  data=data.sort((a,b)=>{
      const byDate=String(b.date||'').localeCompare(String(a.date||''));

              <button class="btn light" onclick="location.href='activity-report.html?id=${a.id}'">📄 التقرير</button>
              ${hasPerm('activitiesDelete')?`<button class="btn red" onclick="deleteActivityBySupervisor('${a.id}')">🗑️ حذف التقرير</button>`:''}
            </div>
          </div>

  if(!a)return;
  const published=a.status==='published';
  const first=confirm('⚠️ حذف تقرير النشاط نهائيًا؟\n\n'+(a.title||'')+'\nمنفذ النشاط: '+executorDisplay(a)+(activityLeaderName(a)&&!isSelfActivityLeader(a)?'\nرائد النشاط: '+activityLeaderName(a):'')+(published?'\n\nهذا التقرير منشور حاليًا لولي الأمر، وسيختفي منه فور الحذف.':'')+'\n\nهل تريد المتابعة؟');
  if(!first)return;
  const typed=prompt('تأكيد أخير: اكتب كلمة حذف');
  if(typed!=='حذف'){alert('تم إلغاء الحذف.');return}
  try{
    await db.collection('activities').doc(id).delete();
    if(current&&current.id===id)closeModal();
    await load();
    alert('تم حذف تقرير النشاط نهائيًا ✅'+(published?'\nوتمت إزالته من عرض ولي الأمر.':''));
  }catch(e){console.error(e);alert('تعذر حذف التقرير:\n'+e.message)}
}
async function deleteCurrentActivity(){if(!current)return;await deleteActivityBySupervisor(current.id)}
function applySupervisorTypeLabel(){
  const type=(localStorage.getItem('currentUserType')||'general_supervisor').toLowerCase();
  const label=type==='manager'?'المدير':(type==='supervisor'?'المشرف':'المشرف العام');
  const target=el('supervisorTypeText');
  if(target)target.textContent='نظام راصد - '+label;
}
async function startSupervisorPage(){if(!protect())return;applySupervisorTypeLabel();try{await loadSupervisorPermissions();await load()}catch(e){console.error(e);if(e.message!=='NO_ACTIVITY_VIEW_PERMISSION')alert('تعذر تحميل صفحة المشرف:\n'+e.message)}}startSupervisorPage();</script></body></html>
