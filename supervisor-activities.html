<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>راصد - مراجعة الأنشطة</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#f4f7fb;color:#172b3f}.head{background:linear-gradient(135deg,#0c2745,#174f7c);color:#fff;text-align:center;padding:18px}.head img{width:76px;height:76px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}.wrap{max-width:1250px;margin:20px auto;padding:0 12px}.card{background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001;margin-bottom:14px;overflow:hidden}.title{background:#eef4fa;padding:14px 18px;font-weight:bold;color:#123c63}.body{padding:16px}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}input,select,textarea{width:100%;padding:9px;border:1px solid #ccd6df;border-radius:7px}.btn{border:0;border-radius:7px;padding:9px 13px;font-weight:bold;cursor:pointer;margin:3px}.primary{background:#174f7c;color:#fff}.green{background:#198754;color:#fff}.gold{background:#d6a821}.red{background:#dc3545;color:#fff}.light{background:#e9eef4}.item{border:1px solid #dfe6ec;border-radius:10px;padding:12px;margin-bottom:10px}.badge{display:inline-block;padding:4px 9px;border-radius:14px;background:#eef4fa}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:9;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.panel{background:#fff;width:min(900px,96%);max-height:92vh;overflow:auto;border-radius:14px}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.muted{color:#68798a;font-size:12px}.image-help{background:#fff8db;border:1px solid #efd77f;color:#715d00;padding:9px 11px;border-radius:8px;margin:10px 0;font-size:12px;line-height:1.7}.photo-publish{display:block;border:1px solid #dfe6ec;border-radius:9px;padding:7px;background:#fafcff}.photo-publish input{width:auto;margin-left:5px}@media(max-width:800px){.filters,.checks{grid-template-columns:1fr}}
.video-review{margin:12px 0;border:1px solid #dbe5ef;border-radius:10px;overflow:hidden;background:#f8fbfd}
.video-review-head{padding:10px 12px;background:#eef4fa;color:#123c63;font-weight:bold}
.video-review-body{padding:12px}
.video-frame{width:100%;height:420px;border:0;border-radius:8px;background:#111}
.video-open{display:inline-block;text-decoration:none;margin-top:9px}
.video-note{font-size:12px;color:#68798a;line-height:1.7;margin-top:7px}
@media(max-width:700px){.video-frame{height:240px}}
</style></head><body><div class="head"><img src="logo.jpeg"><h1>مراجعة تقارير الأنشطة</h1><div id="supervisorTypeText">نظام راصد - الإشراف</div></div><div class="wrap"><div class="card"><div class="title">🔎 البحث والتصفية</div><div class="body"><div class="filters"><input id="q" placeholder="بحث باسم النشاط أو المعلم" oninput="render()"><select id="status" onchange="render()"><option value="">كل الحالات</option><option value="submitted">مرسل للمشرف</option><option value="reviewed">تمت المراجعة</option><option value="revision_requested">معاد للتعديل</option><option value="published">منشور</option></select><input id="date" type="date" onchange="render()"><button class="btn light" onclick="clearFilters()">مسح الفلاتر</button></div></div></div><div class="card"><div class="title">📚 تقارير الأنشطة</div><div class="body"><div id="list">جاري التحميل...</div></div></div></div>
<div class="modal" id="modal"><div class="panel"><div class="title">مراجعة التقرير</div><div class="body" id="review"></div></div></div>
<script>const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();let data=[],current=null,currentRole='',currentUsername='',currentPermissions={activitiesView:false,activitiesReview:false,activitiesPublish:false,activitiesReturn:false,activitiesDelete:false};const el=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function safeUrl(v){
  const s=String(v||'').trim();
  if(!s)return '';
  try{
    const u=new URL(s);
    return ['http:','https:'].includes(u.protocol)?u.href:'';
  }catch{return ''}
}
function drivePreviewUrl(v){
  const url=safeUrl(v);
  if(!url)return '';
  try{
    const u=new URL(url);
    if(!/drive\.google\.com$/i.test(u.hostname)&&!/docs\.google\.com$/i.test(u.hostname))return '';
    let m=u.pathname.match(/\/file\/d\/([^/]+)/);
    let id=m&&m[1];
    if(!id)id=u.searchParams.get('id');
    return id?'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview':'';
  }catch{return ''}
}
function videoReviewHtml(a){
  const url=safeUrl(a?.videoUrl||'');
  if(!url)return '';
  const preview=drivePreviewUrl(url);
  return `<div class="video-review">
    <div class="video-review-head">🎥 فيديو النشاط — للمراجعة الداخلية</div>
    <div class="video-review-body">
      ${preview?`<iframe class="video-frame" src="${esc(preview)}" allow="autoplay; fullscreen" allowfullscreen></iframe>`:''}
      <a class="btn primary video-open" href="${esc(url)}" target="_blank" rel="noopener noreferrer">▶ فتح الفيديو في تبويب جديد</a>
      <div class="video-note">إذا لم تعمل المعاينة، تأكد أن المعلم جعل مشاركة ملف Google Drive متاحة لأي شخص لديه الرابط.</div>
    </div>
  </div>`;
}
function protect(){currentRole=(localStorage.getItem('currentUserRole')||'').toLowerCase();if(!['admin','superadmin','supervisor'].includes(currentRole)){alert('هذه الصفحة للمشرف العام والإدارة فقط');location.href='index.html';return false}return true}function hasPerm(key){return currentRole==='admin'||currentRole==='superadmin'||currentPermissions[key]===true}async function loadSupervisorPermissions(){if(currentRole==='admin'||currentRole==='superadmin'){currentPermissions={activitiesView:true,activitiesReview:true,activitiesPublish:true,activitiesReturn:true,activitiesDelete:true};return}currentUsername=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();if(!currentUsername){throw new Error('لم يتم العثور على اسم مستخدم المشرف.')}const doc=await db.collection('users').doc(currentUsername).get();if(!doc.exists||String(doc.data()?.role||'').toLowerCase()!=='supervisor'){throw new Error('حساب المشرف غير موجود أو لا يحمل دور supervisor.')}const p=doc.data()?.permissions||{};currentPermissions={activitiesView:p.activitiesView!==false,activitiesReview:p.activitiesReview!==false,activitiesPublish:p.activitiesPublish!==false,activitiesReturn:p.activitiesReturn!==false,activitiesDelete:p.activitiesDelete!==false};if(!currentPermissions.activitiesView){alert('ليس لديك صلاحية عرض تقارير الأنشطة.');location.href='index.html';throw new Error('NO_ACTIVITY_VIEW_PERMISSION')}}function label(s){return {submitted:'مرسل للمشرف',reviewed:'تمت المراجعة',revision_requested:'معاد للتعديل',published:'منشور لولي الأمر',draft:'مسودة'}[s]||s}async function load(){const s=await db.collection('activities').get();data=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));render()}function render(){const q=el('q').value.trim().toLowerCase(),st=el('status').value,dt=el('date').value;const rows=data.filter(a=>(!q||[a.title,a.teacherName,a.subjectName].join(' ').toLowerCase().includes(q))&&(!st||a.status===st)&&(!dt||a.date===dt));el('list').innerHTML=rows.map(a=>`<div class="item"><strong>${esc(a.title)}</strong> <span class="badge">${esc(label(a.status))}</span><div class="muted">المعلم: ${esc(a.teacherName)} • ${esc(a.date)} • ${esc(a.location)}</div><div>${(a.classes||[]).map(c=>esc(c.grade+' / '+c.section)).join('، ')}</div>${a.videoUrl?'<div class="muted" style="margin-top:5px">🎥 يوجد فيديو مرفق للمراجعة</div>':''}<button class="btn primary" onclick="openReview('${a.id}')">${hasPerm('activitiesReview')?'👁️ مراجعة':'👁️ عرض التفاصيل'}</button><button class="btn light" onclick="location.href='activity-report.html?id=${a.id}'">📄 التقرير</button>${hasPerm('activitiesDelete')?`<button class="btn red" onclick="deleteActivityBySupervisor('${a.id}')">🗑️ حذف التقرير</button>`:''}</div>`).join('')||'لا توجد نتائج.'}function clearFilters(){el('q').value='';el('status').value='';el('date').value='';render()}function openReview(id){current=data.find(x=>x.id===id);if(!current)return;const v=current.parentVisibility||{};const pub=new Set(Array.isArray(current.publishedImageIndexes)?current.publishedImageIndexes:[]);const imagePublishEnabled=v.images===true;el('review').innerHTML=`<h2>${esc(current.title)}</h2><p><b>المعلم:</b> ${esc(current.teacherName)} | <b>التاريخ:</b> ${esc(current.date)} | <b>المكان:</b> ${esc(current.location)}</p><p>${esc(current.description||'')}</p>${videoReviewHtml(current)}<div class="image-help"><b>الصور:</b> الصور لا تُنشر تلقائيًا. اختر فقط الصور المسموح لولي الأمر برؤيتها. إذا لم تختر أي صورة فلن يظهر قسم الصور نهائيًا لولي الأمر.</div><div class="photos">${(current.images||[]).map((im,i)=>`<label class="photo-publish"><img src="${esc(im.url)}"><br><input type="checkbox" class="pubimg" value="${i}" ${(imagePublishEnabled&&pub.has(i))?'checked':''}> السماح بنشر هذه الصورة</label>`).join('')}</div><h3>العناصر الظاهرة لولي الأمر</h3><div class="checks">${[['title','اسم النشاط'],['teacherName','اسم المعلم'],['subjectName','المادة'],['date','اليوم والتاريخ'],['location','المكان'],['classes','الفصول'],['description','وصف النشاط'],['objectives','الأهداف'],['notes','الملاحظات'],['participantsCount','عدد المشاركين']].map(([k,n])=>`<label><input type="checkbox" class="vis" data-key="${k}" ${v[k]!==false?'checked':''}> ${n}</label>`).join('')}</div><label>ملاحظة المشرف / سبب الإعادة</label><textarea id="reviewNote">${esc(current.reviewNote||'')}</textarea><div>${hasPerm('activitiesPublish')?'<button class="btn green" onclick="publish()">✅ اعتماد ونشر لولي الأمر</button>':''}${hasPerm('activitiesReview')?'<button class="btn gold" onclick="markReviewed()">✔ تمت المراجعة فقط</button>':''}${hasPerm('activitiesReturn')?'<button class="btn red" onclick="returnRevision()">↩ إعادة للمعلم للتعديل</button>':''}${hasPerm('activitiesDelete')?'<button class="btn red" onclick="deleteCurrentActivity()">🗑️ حذف التقرير نهائيًا</button>':''}<button class="btn light" onclick="closeModal()">إغلاق</button></div>`;el('modal').classList.add('show')}function closeModal(){el('modal').classList.remove('show')}function imgs(){return [...document.querySelectorAll('.pubimg:checked')].map(x=>Number(x.value))}function vis(){const o={};document.querySelectorAll('.vis').forEach(x=>o[x.dataset.key]=x.checked);o.images=imgs().length>0;return o}async function updateStatus(status,labelText){const note=el('reviewNote').value.trim();const reviewer=localStorage.getItem('currentUserName')||localStorage.getItem('currentUserEmail')||'المشرف';const patch={status,reviewNote:note,parentVisibility:vis(),publishedImageIndexes:imgs(),reviewedBy:reviewer,reviewedAt:firebase.firestore.FieldValue.serverTimestamp(),history:[...(current.history||[]),{status,label:labelText,at:new Date().toISOString(),by:reviewer}]};if(status==='published')patch.publishedAt=firebase.firestore.FieldValue.serverTimestamp();await db.collection('activities').doc(current.id).set(patch,{merge:true});closeModal();await load()}async function publish(){if(!hasPerm('activitiesPublish')){alert('ليس لديك صلاحية النشر لولي الأمر.');return}await updateStatus('published','تم اعتماد التقرير ونشره لولي الأمر')}async function markReviewed(){if(!hasPerm('activitiesReview')){alert('ليس لديك صلاحية مراجعة التقارير.');return}await updateStatus('reviewed','تمت مراجعة التقرير')}async function returnRevision(){if(!hasPerm('activitiesReturn')){alert('ليس لديك صلاحية إعادة التقرير للمعلم.');return}await updateStatus('revision_requested','أعيد التقرير للمعلم للتعديل')}
async function deleteActivityBySupervisor(id){
  if(!hasPerm('activitiesDelete')){alert('ليس لديك صلاحية حذف تقارير الأنشطة.');return}
  const a=data.find(x=>x.id===id);
  if(!a)return;
  const published=a.status==='published';
  const first=confirm('⚠️ حذف تقرير النشاط نهائيًا؟\n\n'+(a.title||'')+'\nالمعلم: '+(a.teacherName||'-')+(published?'\n\nهذا التقرير منشور حاليًا لولي الأمر، وسيختفي منه فور الحذف.':'')+'\n\nهل تريد المتابعة؟');
  if(!first)return;
  const typed=prompt('تأكيد أخير: اكتب كلمة حذف');
  if(typed!=='حذف'){alert('تم إلغاء الحذف.');return}
  try{
    await db.collection('activities').doc(id).delete();
    if(current&&current.id===id)closeModal();
    await load();
    alert('تم حذف تقرير النشاط نهائيًا ✅'+(published?'\nوتمت إزالته من عرض ولي الأمر.':''));
  }catch(e){console.error(e);alert('تعذر حذف التقرير:\n'+e.message)}
}
async function deleteCurrentActivity(){if(!current)return;await deleteActivityBySupervisor(current.id)}
function applySupervisorTypeLabel(){
  const type=(localStorage.getItem('currentUserType')||'general_supervisor').toLowerCase();
  const label=type==='manager'?'المدير':(type==='supervisor'?'المشرف':'المشرف العام');
  const target=el('supervisorTypeText');
  if(target)target.textContent='نظام راصد - '+label;
}
async function startSupervisorPage(){if(!protect())return;applySupervisorTypeLabel();try{await loadSupervisorPermissions();await load()}catch(e){console.error(e);if(e.message!=='NO_ACTIVITY_VIEW_PERMISSION')alert('تعذر تحميل صفحة المشرف:\n'+e.message)}}startSupervisorPage();</script></body></html>
