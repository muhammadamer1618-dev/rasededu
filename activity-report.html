<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير نشاط - راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>
@page{size:A4 portrait;margin:12mm}
*{box-sizing:border-box}
:root{
  --navy:#073b68;
  --navy2:#0d558c;
  --gold:#d6a821;
  --ink:#172b3f;
  --muted:#64748b;
  --line:#dbe5ef;
  --paper:#ffffff;
  --page:#f3f6f9;
}
body{
  font-family:Tahoma,Arial,sans-serif;
  margin:0;
  background:linear-gradient(180deg,#eaf2fb 0,#f5f8fb 220px,#f3f6f9 100%);
  color:var(--ink);
}
body::before{
  content:"";
  position:fixed;
  inset:0 0 auto 0;
  height:9px;
  background:linear-gradient(90deg,var(--navy),var(--navy2) 68%,var(--gold));
  z-index:0;
}
.actions{
  position:relative;
  z-index:2;
  max-width:900px;
  margin:20px auto 10px;
  padding:0 8px;
  display:flex;
  gap:8px;
  justify-content:flex-start;
}
.btn{
  border:0;
  border-radius:10px;
  padding:11px 18px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:#fff;
  box-shadow:0 4px 12px rgba(7,59,104,.15);
}
.btn:hover{filter:brightness(1.04)}
.light{background:#fff;color:var(--navy);border:1px solid #cbd8e4;box-shadow:none}
.wrap{
  position:relative;
  z-index:1;
  max-width:900px;
  margin:0 auto 30px;
  background:var(--paper);
  padding:0 30px 26px;
  border-radius:18px;
  box-shadow:0 12px 35px rgba(30,58,95,.12);
  overflow:hidden;
  border:1px solid #e3eaf0;
}
.head{
  position:relative;
  margin:0 -30px 24px;
  padding:28px 30px 22px;
  text-align:center;
  color:#fff;
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  border-bottom:5px solid var(--gold);
}
.head::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:50%;
  left:-35px;
  top:-45px;
}
.head img{
  width:86px;
  height:86px;
  object-fit:contain;
  background:#fff;
  border-radius:50%;
  padding:5px;
  border:3px solid rgba(255,255,255,.92);
  box-shadow:0 4px 15px rgba(0,0,0,.18);
}
.head h1{margin:10px 0 3px;font-size:26px;line-height:1.4}
.head h2{margin:0;color:#f7d96c;font-size:17px;font-weight:700}
.report-title{
  text-align:center;
  margin:2px 0 18px;
  color:var(--navy);
  font-size:24px;
  line-height:1.6;
}
.report-title::after{
  content:"";
  display:block;
  width:64px;
  height:3px;
  margin:8px auto 0;
  border-radius:3px;
  background:var(--gold);
}
.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:16px 0 20px;
}
.box{
  border:1px solid #d7e2eb;
  border-right:4px solid var(--navy2);
  border-radius:10px;
  padding:11px 13px;
  background:#f8fbfe;
  line-height:1.7;
}
.box b{color:var(--navy)}
.section{
  margin-top:18px;
  border:1px solid #e2e9ef;
  border-radius:12px;
  padding:0 16px 14px;
  background:#fff;
}
.section h3{
  margin:0 -16px 10px;
  padding:10px 14px;
  color:var(--navy);
  background:linear-gradient(90deg,#eef5fb,#f8fbfd);
  border-bottom:1px solid #dbe5ef;
  border-radius:12px 12px 0 0;
  font-size:16px;
}
.section p{white-space:pre-wrap;line-height:2;margin:0;color:#27394a}
.photos{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.photos img{
  width:100%;
  max-height:340px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #dbe5ef;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}
.report-footer{
  margin:24px -30px -26px;
  padding:13px 20px;
  text-align:center;
  color:#5f7284;
  font-size:12px;
  background:#f5f8fb;
  border-top:1px solid #e2e8ee;
}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
@media(max-width:650px){
  .actions{margin-top:15px}
  .wrap{margin:0 8px 18px;padding:0 16px 18px;border-radius:14px}
  .head{margin:0 -16px 20px;padding:22px 16px 18px}
  .head h1{font-size:21px}
  .report-title{font-size:20px}
  .meta,.photos{grid-template-columns:1fr}
  .report-footer{margin:20px -16px -18px}
}

/* ===== نسخة الطباعة المفرغة - بدون تعبئة لونية ===== */
@media print{
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff!important;color:#000!important}
  body::before{display:none!important}
  .actions{display:none!important}
  .wrap{
    max-width:none!important;
    margin:0!important;
    padding:0!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    overflow:visible!important;
    background:#fff!important;
  }
  .head{
    margin:0 0 10mm!important;
    padding:0 0 5mm!important;
    color:#000!important;
    background:#fff!important;
    border:0!important;
    border-bottom:2px solid #555!important;
  }
  .head::after{display:none!important}
  .head img{
    width:68px!important;
    height:68px!important;
    padding:0!important;
    background:transparent!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
  }
  .head h1{color:#000!important;font-size:19px!important;margin:5px 0 1px!important}
  .head h2{color:#000!important;font-size:13px!important;margin:0!important}
  .report-title{color:#000!important;font-size:18px!important;margin:0 0 6mm!important}
  .report-title::after{display:none!important}
  .meta{gap:4mm;margin:0 0 6mm!important}
  .box{
    background:#fff!important;
    color:#000!important;
    border:1px solid #777!important;
    border-radius:0!important;
    padding:3mm!important;
  }
  .box b{color:#000!important}
  .section{
    background:#fff!important;
    border:1px solid #777!important;
    border-radius:0!important;
    padding:0 4mm 4mm!important;
    margin-top:5mm!important;
    break-inside:avoid;
  }
  .section h3{
    color:#000!important;
    background:#fff!important;
    border:0!important;
    border-bottom:1px solid #777!important;
    border-radius:0!important;
    margin:0 -4mm 3mm!important;
    padding:2.5mm 4mm!important;
  }
  .section p{color:#000!important;line-height:1.7!important}
  .photos{gap:4mm}
  .photos img{
    border:1px solid #999!important;
    border-radius:0!important;
    box-shadow:none!important;
    max-height:115mm!important;
    break-inside:avoid;
  }
  .report-footer{
    background:#fff!important;
    color:#000!important;
    border-top:1px solid #777!important;
    margin:6mm 0 0!important;
    padding:3mm 0 0!important;
  }
  *{-webkit-print-color-adjust:economy!important;print-color-adjust:economy!important}
}
</style></head><body><div class="actions"><button class="btn light" onclick="history.back()">↩ رجوع</button><button class="btn" onclick="print()">🖨️ طباعة التقرير</button></div><div class="wrap" id="report">جاري التحميل...</div><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function parentAllowed(a,studentCode){if(!studentCode)return false;let d=await db.collection('students').doc(String(studentCode)).get();if(!d.exists){const q=await db.collection('students').where('code','==',String(studentCode)).limit(1).get();if(!q.empty)d=q.docs[0]}if(!d.exists)return false;const st=d.data()||{};return (Array.isArray(a.classes)?a.classes:[]).some(c=>c.grade===st.grade&&c.section===st.section)}
async function fullAllowed(a){const role=(localStorage.getItem('currentUserRole')||'').toLowerCase();if(['admin','superadmin','supervisor','manager'].includes(role))return true;if(role!=='teacher')return false;const user=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();return user&&String(a.teacherEmail||'').toLowerCase()===user}
async function load(){const p=new URLSearchParams(location.search),id=p.get('id'),parent=p.get('view')==='parent',studentCode=p.get('studentCode')||'';const out=document.getElementById('report');if(!id){out.textContent='لا يوجد رقم تقرير.';return}const d=await db.collection('activities').doc(id).get();if(!d.exists){out.textContent='التقرير غير موجود.';return}const a=d.data()||{};if(parent){if(a.status!=='published'||!(await parentAllowed(a,studentCode))){out.innerHTML='<div class="empty">هذا التقرير غير متاح لهذا الطالب.</div>';return}}else if(!(await fullAllowed(a))){out.innerHTML='<div class="empty">لا تملك صلاحية عرض هذا التقرير.</div>';return}const v=parent?(a.parentVisibility||{}):{},show=k=>!parent||v[k]!==false,pics=new Set(a.publishedImageIndexes||[]),images=(a.images||[]).filter((_,i)=>!parent||pics.has(i));out.innerHTML=`<div class="head"><img src="logo.jpeg"><h1>مدارس الفلاح الأهلية</h1><h2>تقرير تنفيذ نشاط</h2></div>${show('title')?`<h2 class="report-title">${esc(a.title)}</h2>`:''}<div class="meta">${show('teacherName')?`<div class="box"><b>المعلم:</b> ${esc(a.teacherName)}</div>`:''}${show('subjectName')?`<div class="box"><b>المادة:</b> ${esc(a.subjectName||'-')}</div>`:''}${show('date')?`<div class="box"><b>اليوم والتاريخ:</b> ${esc((a.day||'')+' '+(a.date||''))}</div>`:''}${show('location')?`<div class="box"><b>المكان:</b> ${esc(a.location)}</div>`:''}${show('classes')?`<div class="box"><b>الفصول:</b> ${(a.classes||[]).map(c=>esc(c.grade+' / '+c.section)).join('، ')}</div>`:''}${show('participantsCount')&&a.participantsCount?`<div class="box"><b>عدد المشاركين:</b> ${esc(a.participantsCount)}</div>`:''}</div>${show('description')&&a.description?`<div class="section"><h3>نبذة عن النشاط والتنفيذ</h3><p>${esc(a.description)}</p></div>`:''}${show('objectives')&&a.objectives?`<div class="section"><h3>الأهداف</h3><p>${esc(a.objectives)}</p></div>`:''}${show('notes')&&a.notes?`<div class="section"><h3>ملاحظات</h3><p>${esc(a.notes)}</p></div>`:''}${images.length?`<div class="section"><h3>التوثيق المصور</h3><div class="photos">${images.map(im=>`<img src="${esc(im.url)}" alt="صورة النشاط">`).join('')}</div></div>`:''}${!parent&&a.reviewNote?`<div class="section"><h3>ملاحظة المشرف</h3><p>${esc(a.reviewNote)}</p></div>`:''}<div class="report-footer">نظام راصد - مدارس الفلاح الأهلية</div>`}load().catch(e=>{console.error(e);document.getElementById('report').textContent='تعذر تحميل التقرير.'});
</script></body></html>
