<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير نشاط - راصد</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
@page{size:A4 portrait;margin:6mm}
*{box-sizing:border-box}
:root{--navy:#073b68;--navy2:#0d558c;--gold:#d6a821;--ink:#172b3f;--muted:#64748b;--line:#dbe5ef;--paper:#fff}
body{font-family:Tahoma,Arial,sans-serif;margin:0;background:linear-gradient(180deg,#eaf2fb 0,#f5f8fb 220px,#f3f6f9 100%);color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--navy),var(--navy2) 68%,var(--gold));z-index:0}
.actions{position:relative;z-index:2;max-width:900px;margin:20px auto 10px;padding:0 8px;display:flex;gap:8px;justify-content:flex-start}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 4px 12px rgba(7,59,104,.15)}
.light{background:#fff;color:var(--navy);border:1px solid #cbd8e4;box-shadow:none}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto 30px;background:var(--paper);padding:0 28px 22px;border-radius:18px;box-shadow:0 12px 35px rgba(30,58,95,.12);overflow:hidden;border:1px solid #e3eaf0}
.head{position:relative;margin:0 -28px 19px;padding:21px 28px 17px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));border-bottom:4px solid var(--gold)}
.head img{width:78px;height:78px;object-fit:contain;background:#fff;border-radius:50%;padding:5px;border:3px solid rgba(255,255,255,.92);box-shadow:0 4px 15px rgba(0,0,0,.18)}
.head h1{margin:8px 0 2px;font-size:23px;line-height:1.35}.head h2{margin:0;color:#f7d96c;font-size:15px}
.report-title{text-align:center;margin:2px 0 13px;color:var(--navy);font-size:21px;line-height:1.45}
.report-title::after{content:"";display:block;width:58px;height:3px;margin:6px auto 0;border-radius:3px;background:var(--gold)}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0 15px}
.box{border:1px solid #d7e2eb;border-right:4px solid var(--navy2);border-radius:9px;padding:9px 11px;background:#f8fbfe;line-height:1.6;font-size:13px}.box b{color:var(--navy)}
.section{margin-top:13px;border:1px solid #e2e9ef;border-radius:11px;padding:0 14px 11px;background:#fff}
.section h3{margin:0 -14px 8px;padding:8px 12px;color:var(--navy);background:linear-gradient(90deg,#eef5fb,#f8fbfd);border-bottom:1px solid #dbe5ef;border-radius:11px 11px 0 0;font-size:14px}
.section p{white-space:pre-wrap;line-height:1.75;margin:0;color:#27394a;font-size:13px}
.photos{display:grid;gap:9px}.photos.count-1{grid-template-columns:1fr}.photos.count-2{grid-template-columns:repeat(2,1fr)}.photos.count-3{grid-template-columns:repeat(3,1fr)}
.photos img{width:100%;height:220px;object-fit:cover;border-radius:9px;border:1px solid #dbe5ef;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.leadership-footer{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:650px;margin:17px auto 0;padding-top:13px;border-top:2px solid #d8e2eb}
.leadership-footer.has-activity-leader{grid-template-columns:repeat(3,1fr);max-width:820px}
.leadership-item{text-align:center;border:1px solid #dce5ed;border-radius:10px;padding:9px 6px;background:#fbfdff}
.leadership-role{font-size:11px;color:#6b7d8d;font-weight:bold;margin-bottom:4px}.leadership-name{font-size:13px;color:var(--navy);font-weight:900;line-height:1.5}
.report-footer{margin:15px -28px -22px;padding:10px 18px;text-align:center;color:#5f7284;font-size:11px;background:#f5f8fb;border-top:1px solid #e2e8ee}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}
@media(max-width:650px){.actions{margin-top:15px}.wrap{margin:0 8px 18px;padding:0 14px 16px;border-radius:14px}.head{margin:0 -14px 16px;padding:18px 14px 15px}.head h1{font-size:20px}.report-title{font-size:19px}.meta{grid-template-columns:1fr}.photos.count-2,.photos.count-3{grid-template-columns:1fr}.photos img{height:auto;max-height:360px}.leadership-footer{grid-template-columns:1fr;gap:6px}.report-footer{margin:16px -14px -16px}}

/* ===== طباعة مفرغة ومضغوطة - مستهدفة لصفحة A4 واحدة قدر الإمكان ===== */
@media print{
  @page{size:A4 portrait;margin:5mm}
  html,body{background:#fff!important;color:#000!important;width:100%!important}
  body::before,.actions{display:none!important}
  .wrap{max-width:none!important;width:100%!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important;background:#fff!important}
  .head{margin:0 0 3mm!important;padding:0 0 2.5mm!important;color:#000!important;background:#fff!important;border:0!important;border-bottom:1.5px solid #555!important}
  .head img{width:49px!important;height:49px!important;padding:0!important;background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important}
  .head h1{color:#000!important;font-size:14.5pt!important;margin:2px 0 0!important}.head h2{color:#000!important;font-size:9.5pt!important;margin:0!important}
  .report-title{color:#000!important;font-size:13pt!important;margin:0 0 2.5mm!important;line-height:1.3!important}.report-title::after{display:none!important}
  .meta{grid-template-columns:repeat(3,1fr)!important;gap:2mm!important;margin:0 0 2.5mm!important}
  .box{background:#fff!important;color:#000!important;border:1px solid #777!important;border-right:1px solid #777!important;border-radius:0!important;padding:1.5mm 2mm!important;font-size:8.7pt!important;line-height:1.35!important;min-height:0!important}.box b{color:#000!important}
  .section{background:#fff!important;border:1px solid #777!important;border-radius:0!important;padding:0 2.5mm 2mm!important;margin-top:2.4mm!important;break-inside:avoid}
  .section h3{color:#000!important;background:#fff!important;border:0!important;border-bottom:1px solid #777!important;border-radius:0!important;margin:0 -2.5mm 1.5mm!important;padding:1.5mm 2.5mm!important;font-size:9.2pt!important}
  .section p{color:#000!important;font-size:8.7pt!important;line-height:1.42!important}
  .photos{gap:2mm!important}.photos.count-1{grid-template-columns:1fr!important}.photos.count-2{grid-template-columns:repeat(2,1fr)!important}.photos.count-3{grid-template-columns:repeat(3,1fr)!important}
  .photos img{width:100%!important;height:43mm!important;object-fit:contain!important;border:1px solid #999!important;border-radius:0!important;box-shadow:none!important;break-inside:avoid;background:#fff!important}
  .leadership-footer{grid-template-columns:repeat(2,1fr)!important;max-width:125mm!important;gap:5mm!important;margin:3mm auto 0!important;padding-top:2mm!important;border-top:1px solid #777!important;break-inside:avoid}
  .leadership-footer.has-activity-leader{grid-template-columns:repeat(3,1fr)!important;max-width:185mm!important;gap:2mm!important}
  .leadership-item{background:#fff!important;border:1px solid #888!important;border-radius:0!important;padding:1.5mm 1mm!important}.leadership-role{color:#000!important;font-size:7.8pt!important;margin-bottom:.7mm!important}.leadership-name{color:#000!important;font-size:8.6pt!important;line-height:1.25!important}
  .report-footer{display:block!important;margin:2.5mm 0 0!important;padding:1.8mm 0 0!important;text-align:center!important;color:#000!important;font-size:7.8pt!important;background:#fff!important;border-top:1px solid #777!important;break-inside:avoid!important}
  .print-compact .section p{font-size:8.1pt!important;line-height:1.32!important}.print-compact .photos img{height:38mm!important}.print-compact .section{margin-top:1.8mm!important}.print-compact .meta{margin-bottom:1.8mm!important}
  .print-tight .section p{font-size:7.5pt!important;line-height:1.22!important}.print-tight .photos img{height:33mm!important}.print-tight .head img{width:43px!important;height:43px!important}.print-tight .head h1{font-size:13pt!important}.print-tight .report-title{font-size:11.5pt!important;margin-bottom:1.7mm!important}.print-tight .section{margin-top:1.4mm!important;padding-bottom:1.4mm!important}.print-tight .leadership-footer{margin-top:2mm!important;padding-top:1.5mm!important}
  *{-webkit-print-color-adjust:economy!important;print-color-adjust:economy!important}
}
</style>
</head>
<body>
<div class="actions"><button class="btn light" onclick="history.back()">↩ رجوع</button><button class="btn" onclick="printActivityReport()">🖨️ طباعة التقرير</button></div>
<div class="wrap" id="report">جاري التحميل...</div>
<script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function waitForReportImages(){const imgs=[...document.querySelectorAll('#report img')];if(!imgs.length)return Promise.resolve();return Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.addEventListener('load',resolve,{once:true});img.addEventListener('error',resolve,{once:true});setTimeout(resolve,4000)})))}
async function printActivityReport(){try{const report=document.getElementById('report');if(!report||/جاري التحميل|تعذر تحميل التقرير/.test(report.textContent||'')){alert('انتظر حتى يكتمل تحميل التقرير أولًا.');return}await waitForReportImages();setTimeout(()=>window.print(),120)}catch(e){console.error(e);window.print()}}
async function parentAllowed(a,studentCode){if(!studentCode)return false;let d=await db.collection('students').doc(String(studentCode)).get();if(!d.exists){const q=await db.collection('students').where('code','==',String(studentCode)).limit(1).get();if(!q.empty)d=q.docs[0]}if(!d.exists)return false;const st=d.data()||{};return (Array.isArray(a.classes)?a.classes:[]).some(c=>c.grade===st.grade&&c.section===st.section)}
async function fullAllowed(a){const role=(localStorage.getItem('currentUserRole')||'').toLowerCase();if(['admin','superadmin','supervisor','manager'].includes(role))return true;const user=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();if(role==='activity_leader'){const creator=String(a.createdByEmail||a.activityLeaderEmail||'').trim().toLowerCase();return !!user&&creator===user}if(role!=='teacher')return false;return user&&String(a.teacherEmail||'').toLowerCase()===user}
function isSelfActivityLeader(a){
return String(a?.executorType||"").toLowerCase()==="activity_leader" ||
(
String(a?.createdByRole||"").toLowerCase()==="activity_leader" &&
!String(a?.teacherName||a?.teacherEmail||"").trim()
);
}
function executorDisplay(a){
if(isSelfActivityLeader(a)){
const name=String(a?.executorName||a?.activityLeaderName||a?.createdByName||"رائد النشاط").trim();
return "رائد النشاط - "+name;
}
return String(a?.executorName||a?.teacherName||a?.teacherEmail||"-").trim();
}
function leadershipHtml(a){
const leaderName=String(a?.activityLeaderName||a?.createdByName||"").trim();
const isActivityLeaderReport=
  String(a?.createdByRole||"").toLowerCase()==="activity_leader" ||
  !!String(a?.activityLeaderName||"").trim();

return `
<div class="leadership-footer ${isActivityLeaderReport?'has-activity-leader':''}">
  ${isActivityLeaderReport?`
  <div class="leadership-item">
    <div class="leadership-role">رائد النشاط</div>
    <div class="leadership-name">${esc(leaderName||'رائد النشاط')}</div>
  </div>`:''}

  <div class="leadership-item">
    <div class="leadership-role">المشرف العام</div>
    <div class="leadership-name">أحمد سمير</div>
  </div>

  <div class="leadership-item">
    <div class="leadership-role">مدير المدرسة</div>
    <div class="leadership-name">عبد العزيز القحطاني</div>
  </div>
</div>
`;
}
function applyPrintDensity(a,images){const out=document.getElementById('report');const textLen=[a.description,a.objectives,a.notes,a.reviewNote].filter(Boolean).join(' ').length;if(textLen>900||images.length>=3)out.classList.add('print-compact');if(textLen>1600||(textLen>1100&&images.length>=2))out.classList.add('print-tight')}
async function load(){
  const p=new URLSearchParams(location.search),id=p.get('id'),parent=p.get('view')==='parent',studentCode=p.get('studentCode')||'';
  const out=document.getElementById('report');
  if(!id){out.textContent='لا يوجد رقم تقرير.';return}
  const d=await db.collection('activities').doc(id).get();
  if(!d.exists){out.textContent='التقرير غير موجود.';return}
  const a=d.data()||{};
  if(parent){if(a.status!=='published'||!(await parentAllowed(a,studentCode))){out.innerHTML='<div class="empty">هذا التقرير غير متاح لهذا الطالب.</div>';return}}
  else if(!(await fullAllowed(a))){out.innerHTML='<div class="empty">لا تملك صلاحية عرض هذا التقرير.</div>';return}

  const v=parent?(a.parentVisibility||{}):{},show=k=>!parent||v[k]!==false;
  /* الصور في عرض ولي الأمر Opt-in فقط: لا تظهر إلا إذا اعتمد المشرف نشر الصور واختار صورًا بعينها */
  const imageSectionAllowed=!parent||v.images===true;
  const pics=new Set(Array.isArray(a.publishedImageIndexes)?a.publishedImageIndexes:[]);
  const images=(Array.isArray(a.images)?a.images:[]).filter((_,i)=>!parent||(imageSectionAllowed&&pics.has(i)));
  const photoClass='count-'+Math.max(1,Math.min(images.length,3));

  out.innerHTML=`
    <div class="head"><img src="logo.jpeg"><h1>مدارس الفلاح الأهلية</h1><h2>تقرير تنفيذ نشاط</h2></div>
    ${show('title')?`<h2 class="report-title">${esc(a.title)}</h2>`:''}
    <div class="meta">
      ${show('teacherName')?`<div class="box"><b>منفذ النشاط:</b> ${esc(executorDisplay(a))}</div>`:''}
      ${show('subjectName')?`<div class="box"><b>المادة:</b> ${esc(a.subjectName||'-')}</div>`:''}
      ${show('date')?`<div class="box"><b>اليوم والتاريخ:</b> ${esc([a.day,a.date].filter(Boolean).join(' - '))}</div>`:''}
      ${show('location')?`<div class="box"><b>المكان:</b> ${esc(a.location)}</div>`:''}
      ${show('classes')?`<div class="box"><b>الفصول:</b> ${(a.classes||[]).map(c=>esc(c.grade+' / '+c.section)).join('، ')}</div>`:''}
      ${show('participantsCount')&&a.participantsCount?`<div class="box"><b>عدد المشاركين:</b> ${esc(a.participantsCount)}</div>`:''}
    </div>
    ${show('description')&&a.description?`<div class="section"><h3>نبذة عن النشاط والتنفيذ</h3><p>${esc(a.description)}</p></div>`:''}
    ${show('objectives')&&a.objectives?`<div class="section"><h3>الأهداف</h3><p>${esc(a.objectives)}</p></div>`:''}
    ${show('notes')&&a.notes?`<div class="section"><h3>ملاحظات</h3><p>${esc(a.notes)}</p></div>`:''}
    ${images.length?`<div class="section"><h3>التوثيق المصور</h3><div class="photos ${photoClass}">${images.map(im=>`<img src="${esc(im.url)}" alt="صورة النشاط">`).join('')}</div></div>`:''}
    ${!parent&&a.reviewNote?`<div class="section"><h3>ملاحظة المشرف</h3><p>${esc(a.reviewNote)}</p></div>`:''}
    ${leadershipHtml(a)}
    <div class="report-footer">مدارس الفلاح الأهلية - تصميم محمد عامر أحمد</div>`;
  applyPrintDensity(a,images);
}
load().then(async()=>{const p=new URLSearchParams(location.search);if(p.get('print')==='1'){await waitForReportImages();setTimeout(()=>window.print(),180)}}).catch(e=>{console.error(e);document.getElementById('report').textContent='تعذر تحميل التقرير.'});
</script>
</body>
</html>
