<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير نشاط - راصد</title><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><style>@page{size:A4 portrait;margin:12mm}*{box-sizing:border-box}body{font-family:Tahoma,Arial;margin:0;background:#f4f7fb;color:#172b3f}.wrap{max-width:900px;margin:20px auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 3px 14px #0001}.head{text-align:center;border-bottom:3px solid #174f7c;padding-bottom:12px}.head img{width:78px;height:78px;object-fit:contain}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.box{border:1px solid #dbe5ef;border-radius:8px;padding:10px}.section{margin-top:16px}.section h3{color:#174f7c;border-bottom:1px solid #dbe5ef;padding-bottom:6px}.section p{white-space:pre-wrap;line-height:1.9}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.photos img{width:100%;max-height:320px;object-fit:cover;border-radius:8px}.actions{text-align:center;margin:15px;display:flex;gap:8px;justify-content:center}.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:bold;cursor:pointer;background:#174f7c;color:white}.light{background:#e9eef4;color:#173b5d}.empty{text-align:center;padding:35px;color:#64748b}@media(max-width:650px){.meta,.photos{grid-template-columns:1fr}}@media print{body{background:#fff}.wrap{box-shadow:none;margin:0;max-width:none;padding:0}.actions{display:none}}</style></head><body><div class="actions"><button class="btn light" onclick="history.back()">↩ رجوع</button><button class="btn" onclick="print()">🖨️ طباعة التقرير</button></div><div class="wrap" id="report">جاري التحميل...</div><script>
const firebaseConfig={apiKey:"AIzaSyAfgSV-6_IMkXncgPWxY69omKfvFtGakgk",authDomain:"results2026-7c0dd.firebaseapp.com",projectId:"results2026-7c0dd",storageBucket:"results2026-7c0dd.firebasestorage.app",messagingSenderId:"241421115694",appId:"1:241421115694:web:96f55fd9fd1d5b18b31abf"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function parentAllowed(a,studentCode){if(!studentCode)return false;let d=await db.collection('students').doc(String(studentCode)).get();if(!d.exists){const q=await db.collection('students').where('code','==',String(studentCode)).limit(1).get();if(!q.empty)d=q.docs[0]}if(!d.exists)return false;const st=d.data()||{};return (Array.isArray(a.classes)?a.classes:[]).some(c=>c.grade===st.grade&&c.section===st.section)}
async function fullAllowed(a){const role=(localStorage.getItem('currentUserRole')||'').toLowerCase();if(['admin','superadmin','supervisor','manager'].includes(role))return true;if(role!=='teacher')return false;const user=(localStorage.getItem('currentUserEmail')||localStorage.getItem('currentUser')||'').trim().toLowerCase();return user&&String(a.teacherEmail||'').toLowerCase()===user}
async function load(){const p=new URLSearchParams(location.search),id=p.get('id'),parent=p.get('view')==='parent',studentCode=p.get('studentCode')||'';const out=document.getElementById('report');if(!id){out.textContent='لا يوجد رقم تقرير.';return}const d=await db.collection('activities').doc(id).get();if(!d.exists){out.textContent='التقرير غير موجود.';return}const a=d.data()||{};if(parent){if(a.status!=='published'||!(await parentAllowed(a,studentCode))){out.innerHTML='<div class="empty">هذا التقرير غير متاح لهذا الطالب.</div>';return}}else if(!(await fullAllowed(a))){out.innerHTML='<div class="empty">لا تملك صلاحية عرض هذا التقرير.</div>';return}const v=parent?(a.parentVisibility||{}):{},show=k=>!parent||v[k]!==false,pics=new Set(a.publishedImageIndexes||[]),images=(a.images||[]).filter((_,i)=>!parent||pics.has(i));out.innerHTML=`<div class="head"><img src="logo.jpeg"><h1>مدارس الفلاح الأهلية</h1><h2>تقرير تنفيذ نشاط</h2></div>${show('title')?`<h2 style="text-align:center">${esc(a.title)}</h2>`:''}<div class="meta">${show('teacherName')?`<div class="box"><b>المعلم:</b> ${esc(a.teacherName)}</div>`:''}${show('subjectName')?`<div class="box"><b>المادة:</b> ${esc(a.subjectName||'-')}</div>`:''}${show('date')?`<div class="box"><b>اليوم والتاريخ:</b> ${esc((a.day||'')+' '+(a.date||''))}</div>`:''}${show('location')?`<div class="box"><b>المكان:</b> ${esc(a.location)}</div>`:''}${show('classes')?`<div class="box"><b>الفصول:</b> ${(a.classes||[]).map(c=>esc(c.grade+' / '+c.section)).join('، ')}</div>`:''}${show('participantsCount')&&a.participantsCount?`<div class="box"><b>عدد المشاركين:</b> ${esc(a.participantsCount)}</div>`:''}</div>${show('description')&&a.description?`<div class="section"><h3>نبذة عن النشاط والتنفيذ</h3><p>${esc(a.description)}</p></div>`:''}${show('objectives')&&a.objectives?`<div class="section"><h3>الأهداف</h3><p>${esc(a.objectives)}</p></div>`:''}${show('notes')&&a.notes?`<div class="section"><h3>ملاحظات</h3><p>${esc(a.notes)}</p></div>`:''}${images.length?`<div class="section"><h3>التوثيق المصور</h3><div class="photos">${images.map(im=>`<img src="${esc(im.url)}" alt="صورة النشاط">`).join('')}</div></div>`:''}${!parent&&a.reviewNote?`<div class="section"><h3>ملاحظة المشرف</h3><p>${esc(a.reviewNote)}</p></div>`:''}<div style="margin-top:20px;text-align:center;color:#64748b;font-size:12px">نظام راصد - مدارس الفلاح الأهلية</div>`}load().catch(e=>{console.error(e);document.getElementById('report').textContent='تعذر تحميل التقرير.'});
</script></body></html>
